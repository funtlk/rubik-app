<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кубик Рубика — Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 16px;
            box-sizing: border-box;
        }
        .view { display: none; }
        .view.active { display: block; }
        .btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #debug-log {
            background: #333;
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 16px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="debug-log">Статус: Загрузка...</div>

    <div id="view-main" class="view active">
        <h1>Главное меню</h1>
        <button class="btn" onclick="tryNavigate('view-cfop')">Открыть CFOP</button>
    </div>

    <div id="view-cfop" class="view">
        <h1>Этапы CFOP</h1>
        <button class="btn" onclick="tryNavigate('view-main')">← Назад в меню</button>
    </div>

    <script>
        function log(msg) {
            document.getElementById('debug-log').innerText = "Статус: " + msg;
            console.log(msg);
        }

        try {
            let tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            log("Telegram WebApp инициализирован");
        } catch (e) {
            log("Ошибка Telegram: " + e.message);
        }

        function tryNavigate(viewId) {
            log("Клик по кнопке! Переход на: " + viewId);
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            let target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active');
                log("Успешно переключено на " + viewId);
            } else {
                log("ОШИБКА: Элемент " + viewId + " не найден!");
            }
        }
    </script>
</body>
</html>
