<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика - Полный справочник CFOP и Симулятор</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --button-color: #007aff;
            --button-text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .view {
            display: none;
            width: 100%;
        }
        .view.active {
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            margin: 0 0 6px 0;
        }
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .lang-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lang-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .lang-btn.active-lang {
            border-color: var(--button-color);
            background-color: rgba(0, 122, 255, 0.2);
        }
        .menu-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
        }
        .cube-section {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }
        #cube-container {
            width: 220px;
            height: 220px;
            margin-bottom: 12px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none; /* Completely static, no touch rotation */
        }
        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            gap: 3px;
        }
        .ctrl-btn {
            flex: 1;
            background-color: rgba(255,255,255,0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .ctrl-btn:active {
            background-color: var(--button-color);
        }
        .ctrl-btn.spec {
            background-color: rgba(0, 122, 255, 0.2);
            color: #4da3ff;
            border-color: rgba(0, 122, 255, 0.4);
        }
        .list-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 70vh;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .case-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .case-card h3 {
            font-size: 15px;
            margin: 0 0 6px 0;
        }
        .case-card p {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--button-color);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            padding: 0;
            text-align: left;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .detail-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .formula-box {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="container">
    <div id="view-main" class="view active">
        <div class="header">
            <h1 id="t-main-title">🧩 Кубик Рубика</h1>
            <p id="t-main-sub">Интерактивный справочник CFOP и Симулятор</p>
        </div>

        <div class="lang-container">
            <button class="lang-btn active-lang" id="btn-ru" onclick="setLang('ru')">🇷🇺 РУС</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 ENG</button>
            <button class="lang-btn" id="btn-uk" onclick="setLang('uk')">🇺🇦 УКР</button>
            <button class="lang-btn" id="btn-es" onclick="setLang('es')">🇪🇸 ESP</button>
        </div>

        <button class="menu-btn" onclick="showView('view-cfop')" id="t-btn-cfop">🧩 Метод CFOP (Фридрих)</button>
        <button class="menu-btn" onclick="showView('view-4lll')" id="t-btn-4lll" style="background-color: #2c2c2e; color: #fff;">📗 Метод 4LLL (Упрощенный CFOP)</button>

        <div class="cube-section">
            <div style="width: 100%; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;">
                <label id="t-custom-formula-label" style="font-size: 11px; color: var(--text-secondary); text-align: center;">Введите или вставьте формулу, чтобы собрать/воспроизвести ситуацию:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="custom-formula-input" placeholder="Например: R U R' U'" style="flex: 1; padding: 8px 10px; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-family: monospace; font-size: 13px; outline: none;">
                    <button onclick="executeCustomFormula()" id="t-apply-formula-btn" style="background-color: var(--button-color); color: var(--button-text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Применить</button>
                    <button onclick="resetCube()" id="t-reset-btn" style="background-color: #3a3a3c; color: var(--text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Сброс</button>
                </div>
            </div>
            <div id="cube-container"></div>
            <div class="controls-panel">
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('R')">R</button>
                    <button class="ctrl-btn" onclick="applyMove('R\'')">R'</button>
                    <button class="ctrl-btn" onclick="applyMove('L')">L</button>
                    <button class="ctrl-btn" onclick="applyMove('L\'')">L'</button>
                    <button class="ctrl-btn" onclick="applyMove('U')">U</button>
                    <button class="ctrl-btn" onclick="applyMove('U\'')">U'</button>
                </div>
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('D')">D</button>
                    <button class="ctrl-btn" onclick="applyMove('D\'')">D'</button>
                    <button class="ctrl-btn" onclick="applyMove('F')">F</button>
                    <button class="ctrl-btn" onclick="applyMove('F\'')">F'</button>
                    <button class="ctrl-btn" onclick="applyMove('B')">B</button>
                    <button class="ctrl-btn" onclick="applyMove('B\'')">B'</button>
                </div>
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('r')">r</button>
                    <button class="ctrl-btn" onclick="applyMove('r\'')">r'</button>
                    <button class="ctrl-btn" onclick="applyMove('l')">l</button>
                    <button class="ctrl-btn" onclick="applyMove('l\'')">l'</button>
                    <button class="ctrl-btn" onclick="applyMove('u')">u</button>
                    <button class="ctrl-btn" onclick="applyMove('u\'')">u'</button>
                </div>
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('d')">d</button>
                    <button class="ctrl-btn" onclick="applyMove('d\'')">d'</button>
                    <button class="ctrl-btn" onclick="applyMove('f')">f</button>
                    <button class="ctrl-btn" onclick="applyMove('f\'')">f'</button>
                    <button class="ctrl-btn" onclick="applyMove('b')">b</button>
                    <button class="ctrl-btn" onclick="applyMove('b\'')">b'</button>
                </div>
                <div class="control-row special-row">
                    <button class="ctrl-btn spec" onclick="applyMove('x')">x</button>
                    <button class="ctrl-btn spec" onclick="applyMove('x\'')">x'</button>
                    <button class="ctrl-btn spec" onclick="applyMove('y')">y</button>
                    <button class="ctrl-btn spec" onclick="applyMove('y\'')">y'</button>
                    <button class="ctrl-btn spec" onclick="applyMove('z')">z</button>
                    <button class="ctrl-btn spec" onclick="applyMove('z\'')">z'</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-cfop" class="view">
        <button class="back-btn" onclick="showView('view-main')" id="t-back-main">← На главную</button>
        <div class="header">
            <h1 id="t-cfop-title">Метод CFOP</h1>
            <p id="t-cfop-sub">Выберите этап</p>
        </div>
        <button class="menu-btn" onclick="openCategory('f2l')" id="t-f2l-name">F2L (Первые два слоя - 41 случай)</button>
        <button class="menu-btn" onclick="openCategory('oll')" id="t-oll-name">OLL (Ориентация последнего слоя - 57 случаев)</button>
        <button class="menu-btn" onclick="openCategory('pll')" id="t-pll-name">PLL (Пермутация последнего слоя - 21 случай)</button>
    </div>

    <div id="view-4lll" class="view">
        <button class="back-btn" onclick="showView('view-main')">← На главную</button>
        <div class="header">
            <h1>Упрощенный CFOP (4LLL)</h1>
            <p>Базовые алгоритмы для быстрой сборки</p>
        </div>
        <div id="list-4lll-container" class="list-grid"></div>
    </div>

    <div id="view-list" class="view">
        <button class="back-btn" onclick="showView('view-cfop')" id="t-back-detail">← К списку этапов</button>
        <input type="text" class="search-box" id="search" placeholder="Поиск алгоритма..." oninput="filterAlgorithms()">
        <div id="algorithms-list" class="list-grid"></div>
    </div>

    <div id="view-detail" class="view">
        <button class="back-btn" onclick="showView('view-list')" id="t-back-to-list">← К списку</button>
        <div class="detail-card">
            <h2 id="detail-title" style="margin:0; font-size: 20px;">Название</h2>
            <p id="detail-desc" style="color: var(--text-secondary); margin:0; font-size: 14px;"></p>
            <div>
                <span style="font-size: 13px; color: var(--text-secondary);" id="t-formula-label">Формула (Алгоритм решения):</span>
                <div class="formula-box" id="detail-formula">R U R'</div>
            </div>
            <div>
                <span style="font-size: 13px; color: var(--text-secondary);" id="t-scramble-label">Скрамбл (Для создания ситуации):</span>
                <div class="formula-box" id="detail-scramble" style="color: #4da3ff;">R U R'</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="copy-btn" onclick="copyFormula()" id="t-copy-btn" style="flex: 1;">Копировать формулу</button>
                <button class="copy-btn" onclick="applyCaseScramble()" id="t-apply-scramble-btn" style="background-color: #34c759; flex: 1;">Собрать ситуацию</button>
            </div>
        </div>
    </div>
</div>

    // Function to calculate inverse move sequence for scramble generation
    function getInverseScramble(formula) {
        let text = formula;
        text = text.replace(/\(([^)]+)\)\s*3/g, "$1 $1 $1");
        text = text.replace(/\(([^)]+)\)\s*2/g, "$1 $1");
        text = text.replace(/[()]/g, ' ');

        const tokens = text.split(/\s+/).filter(t => t.length > 0);
        let inverseTokens = [];
        
        for (let i = tokens.length - 1; i >= 0; i--) {
            let token = tokens[i];
            if (token.includes("'")) {
                inverseTokens.push(token.replace("'", ""));
            } else if (token.includes("2")) {
                inverseTokens.push(token);
            } else {
                inverseTokens.push(token + "'");
            }
        }
        return inverseTokens.join(' ');
    }

        const scramble = getInverseScramble(item.formula);
        document.getElementById('detail-scramble').innerText = scramble;

    async function applyCaseScramble() {
        if (!currentItemData) return;
        const scramble = getInverseScramble(currentItemData.formula);
        const formulaInput = document.getElementById('custom-formula-input');
        if (formulaInput) formulaInput.value = scramble;
        await executeCustomFormula();
    }

    async function executeCustomFormula() {
        if (isMoving) return;
        const input = document.getElementById('custom-formula-input');
        if (!input) return;
        
        let text = input.value.trim();
        text = text.replace(/\(([^)]+)\)\s*3/g, "$1 $1 $1");
        text = text.replace(/\(([^)]+)\)\s*2/g, "$1 $1");
        text = text.replace(/[()]/g, ' ');

        const tokens = text.split(/\s+/).filter(t => t.length > 0);
        for (let token of tokens) {
            while (isMoving) {
                await new Promise(r => setTimeout(r, 50));
            }
            applyMove(token);
        }
    }

    function resetCube() {
        if (isMoving) return;
        if (cubeGroup) {
            scene.remove(cubeGroup);
        }
        cubies = [];
        cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const size = 0.92;
        const geom = new THREE.BoxGeometry(size, size, size);

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const materials = [
                        new THREE.MeshBasicMaterial({ color: x === 1 ? COLORS.R : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: x === -1 ? COLORS.L : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: y === 1 ? COLORS.U : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: y === -1 ? COLORS.D : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: z === 1 ? COLORS.F : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: z === -1 ? COLORS.B : COLORS.IN })
                    ];
                    const mesh = new THREE.Mesh(geom, materials);
                    mesh.position.set(x, y, z);
                    mesh.userData = { origX: x, origY: y, origZ: z };
                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
            }

    // Robust 3D Rubik's Cube Engine using state-based cubies
    let scene, camera, renderer, cubeGroup;
    let cubies = [];
    let isMoving = false;

    const COLORS = {
        R: 0xc41e3a, // Right - Red
        L: 0xff5800, // Left - Orange
        U: 0xffffff, // Up - White
        D: 0xffd500, // Down - Yellow
        F: 0x0051ba, // Front - Blue
        B: 0x009e60, // Back - Green
        IN: 0x111111 // Internal
    };

    function initRubikCube() {
        const container = document.getElementById('cube-container');
        if (!container) return;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(4.5, 4.0, 5.5);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const size = 0.92;
        const geom = new THREE.BoxGeometry(size, size, size);

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const materials = [
                        new THREE.MeshBasicMaterial({ color: x === 1 ? COLORS.R : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: x === -1 ? COLORS.L : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: y === 1 ? COLORS.U : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: y === -1 ? COLORS.D : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: z === 1 ? COLORS.F : COLORS.IN }),
                        new THREE.MeshBasicMaterial({ color: z === -1 ? COLORS.B : COLORS.IN })
                    ];
                    const mesh = new THREE.Mesh(geom, materials);
                    mesh.position.set(x, y, z);
                    mesh.userData = { origX: x, origY: y, origZ: z };
                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
            }
        }
        renderer.render(scene, camera);
    }

    function applyMove(moveStr) {
        if (isMoving) return;
        isMoving = true;

        const base = moveStr[0];
        const isPrime = moveStr.includes("'");
        const isDouble = moveStr.includes("2");

        let axis = new THREE.Vector3();
        let filter = c => false;
        let angle = (isPrime ? Math.PI / 2 : -Math.PI / 2);
        if (isDouble) angle *= 2;

        switch (base) {
            case 'R': axis.set(1, 0, 0); filter = c => c.position.x > 0.5; break;
            case 'L': axis.set(-1, 0, 0); filter = c => c.position.x < -0.5; angle = -angle; break;
            case 'U': axis.set(0, 1, 0); filter = c => c.position.y > 0.5; break;
            case 'D': axis.set(0, -1, 0); filter = c => c.position.y < -0.5; angle = -angle; break;
            case 'F': axis.set(0, 0, 1); filter = c => c.position.z > 0.5; break;
            case 'B': axis.set(0, 0, -1); filter = c => c.position.z < -0.5; angle = -angle; break;

            case 'r': axis.set(1, 0, 0); filter = c => c.position.x > -0.5; break;
            case 'l': axis.set(-1, 0, 0); filter = c => c.position.x < 0.5; angle = -angle; break;
            case 'u': axis.set(0, 1, 0); filter = c => c.position.y > -0.5; break;
            case 'd': axis.set(0, -1, 0); filter = c => c.position.y < 0.5; angle = -angle; break;
            case 'f': axis.set(0, 0, 1); filter = c => c.position.z > -0.5; break;
            case 'b': axis.set(0, 0, -1); filter = c => c.position.z < 0.5; angle = -angle; break;

            case 'x': axis.set(1, 0, 0); filter = c => true; break;
            case 'y': axis.set(0, 1, 0); filter = c => true; break;
            case 'z': axis.set(0, 0, 1); filter = c => true; break;
        }

        const pivot = new THREE.Group();
        scene.add(pivot);

        const affected = cubies.filter(filter);
        affected.forEach(c => {
            cubeGroup.remove(c);
            pivot.add(c);
        });

        const steps = 12;
        const stepAngle = angle / steps;
        let currentStep = 0;

        function animateStep() {
            currentStep++;
            if (axis.x !== 0) pivot.rotation.x += stepAngle * axis.x;
            if (axis.y !== 0) pivot.rotation.y += stepAngle * axis.y;
            if (axis.z !== 0) pivot.rotation.z += stepAngle * axis.z;
            renderer.render(scene, camera);

            if (currentStep < steps) {
                requestAnimationFrame(animateStep);
            } else {
                pivot.updateMatrixWorld();
                affected.forEach(c => {
                    c.applyMatrix4(pivot.matrixWorld);
                    c.position.x = Math.round(c.position.x);
                    c.position.y = Math.round(c.position.y);
                    c.position.z = Math.round(c.position.z);
                    pivot.remove(c);
                    cubeGroup.add(c);
                });
                scene.remove(pivot);
                renderer.render(scene, camera);
                isMoving = false;
            }
        }
        animateStep();
    }

    window.onload = function() {
        initRubikCube();
        const list4lll = [
            { id: 1, name: "OLL 21 (Крест)", desc: "Стандартный крест", formula: "F (R U R' U')3 F'" },
            { id: 2, name: "OLL 27 (Рыбка)", desc: "Классическая рыбка", formula: "R U R' U R U2 R'" },
            { id: 3, name: "PLL T-Perm", desc: "Перестановка T", formula: "R U R' U' R' F R2 U' R' U' R U R' F'" },
            { id: 4, name: "PLL U-Perm", desc: "Перестановка U", formula: "R U' R U R U R U' R' U' R2" }
        ];
        algorithmsData['4lll'] = list4lll;
        const container4lll = document.getElementById('list-4lll-container');
        if (container4lll) {
            list4lll.forEach(item => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = () => { currentCategory = '4lll'; openDetail(item); };
                card.innerHTML = `<h3>${item.name}</h3><p>${item.desc}</p>`;
                container4lll.appendChild(card);
            });
        }
    };
</script>
