<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Cube Guide</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #f1f1f1);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #007aff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            box-sizing: border-box;
        }
        .view { display: none; }
        .view.active { display: block; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 16px; }
        .subtitle { text-align: center; color: var(--hint-color); font-size: 14px; margin-bottom: 20px; }
        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
            justify-content: center;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--button-color);
            font-size: 16px;
            font-weight: 600;
            padding: 0;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .formula-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            background: rgba(128,128,128,0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 8px;
            word-break: break-all;
        }
        .copy-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(128,128,128,0.3);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .lang-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 20px;
        }
        .lang-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(128,128,128,0.3);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
        }
        .lang-btn.active-lang {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Главное меню -->
    <div id="view-main" class="view active">
        <h1 id="t-main-title"> Кубик Рубика</h1>
        <p class="subtitle" id="t-main-sub">Интерактивный справочник методов</p>
        <button class="btn btn-primary" onclick="switchView('view-cfop')" id="t-btn-cfop">Метод CFOP (Фридрих)</button>
        <button class="btn" onclick="showStub('Roux')">🔄 Roux Method (soon)</button>
        <button class="btn" onclick="showStub('Beginner')">📖 Beginner Method (soon)</button>
        
        <div class="lang-container">
            <button class="lang-btn active-lang" id="btn-ru" onclick="setLang('ru')">🇷🇺 РУС</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 ENG</button>
            <button class="lang-btn" id="btn-uk" onclick="setLang('uk')">🇺🇦 УКР</button>
            <button class="lang-btn" id="btn-es" onclick="setLang('es')">🇪🇸 ESP</button>
        </div>
    </div>

    <!-- Меню CFOP -->
    <div id="view-cfop" class="view">
        <button class="back-btn" onclick="switchView('view-main')" id="t-back-main">← Главное меню</button>
        <h1 id="t-cfop-title">Метод CFOP</h1>
        <p class="subtitle" id="t-cfop-sub">Выберите этап для изучения</p>
        <button class="btn" onclick="openStage('4lll')"><span id="t-4lll-name">🔰 4LLL (Новичковый CFOP)</span> <span>›</span></button>
        <button class="btn" onclick="openStage('f2l')"><span id="t-f2l-name">1. F2L (42 случая)</span> <span>›</span></button>
        <button class="btn" onclick="openStage('oll')"><span id="t-oll-name">2. OLL (57 случаев)</span> <span>›</span></button>
        <button class="btn btn-primary" onclick="openStage('pll')"><span id="t-pll-name">3. PLL (21 случай)</span> <span>›</span></button>
    </div>

    <!-- Список алгоритмов -->
    <div id="view-list" class="view">
        <button class="back-btn" onclick="switchView('view-cfop')" id="t-back-cfop">← К этапам CFOP</button>
        <h1 id="stage-title">Список алгоритмов</h1>
        <input type="text" id="search" class="search-box" placeholder="Поиск..." oninput="filterList()">
        <div id="list-container"></div>
    </div>

    <!-- Детали алгоритма -->
    <div id="view-detail" class="view">
        <button class="back-btn" onclick="switchView('view-list')" id="t-back-list">← К списку</button>
        <div class="card">
            <h2 id="det-title" style="margin-top:0; font-size:20px;">Название</h2>
            <p id="det-desc" style="color: var(--hint-color); font-size: 14px; margin-bottom: 12px;"></p>
            <p id="t-formula-label" style="margin-bottom: 6px; font-size: 14px; font-weight: 600;">Формула:</p>
            <div class="formula-box">
                <span id="det-formula"></span>
                <button class="copy-btn" onclick="copyText()" id="t-copy-btn">Копировать</button>
            </div>
        </div>
    </div>

    <script>
        try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        } catch(e) {}

        let currentLang = 'ru';
        let currentStageKey = '4lll';

        const translations = {
            ru: {
                mainTitle: " Кубик Рубика",
                mainSub: "Интерактивный справочник методов",
                btnCfop: " Метод CFOP (Фридрих)",
                backMain: "← Главное меню",
                cfopTitle: "Метод CFOP",
                cfopSub: "Выберите этап для изучения",
                fourLllName: " 4LLL (Упрощенный CFOP)",
                f2lName: "1. F2L (42 случая)",
                ollName: "2. OLL (57 случаев)",
                pllName: "3. PLL (21 случай)",
                backCfop: "← К этапам CFOP",
                backList: "← К списку",
                searchPH: "Поиск по названию или описанию...",
                formulaLabel: "Формула:",
                copyBtn: "Копировать",
                copiedAlert: "Формула скопирована!",
                soonStub: " появится в обновлении!"
            },
            en: {
                mainTitle: " Rubik's Cube",
                mainSub: "Interactive Methods Guide",
                btnCfop: " CFOP Method (Fridrich)",
                backMain: "← Main Menu",
                cfopTitle: "CFOP Method",
                cfopSub: "Select a stage to study",
                fourLllName: "4LLL (Simplified CFOP)",
                f2lName: "1. F2L (42 cases)",
                ollName: "2. OLL (57 cases)",
                pllName: "3. PLL (21 cases)",
                backCfop: "← Back to CFOP Stages",
                backList: "← Back to list",
                searchPH: "Search by name or description...",
                formulaLabel: "Formula:",
                copyBtn: "Copy",
                copiedAlert: "Formula copied!",
                soonStub: " will be available soon!"
            },
            uk: {
                mainTitle: " Кубик Рубика",
                mainSub: "Інтерактивний довідник методів",
                btnCfop: " Метод CFOP (Фрідріх)",
                backMain: "← Головне меню",
                cfopTitle: "Метод CFOP",
                cfopSub: "Оберіть етап для вивчення",
                fourLllName: " 4LLL (Спрощений CFOP)",
                f2lName: "1. F2L (42 випадки)",
                ollName: "2. OLL (57 випадків)",
                pllName: "3. PLL (21 випадок)",
                backCfop: "← До етапів CFOP",
                backList: "← До списку",
                searchPH: "Пошук за назвою чи описом...",
                formulaLabel: "Формула:",
                copyBtn: "Копіювати",
                copiedAlert: "Формулу скопійовано!",
                soonStub: " з'явиться в оновленні!"
            },
            es: {
                mainTitle: " Cubo de Rubik",
                mainSub: "Guía Interactiva de Métodos",
                btnCfop: " Método CFOP (Fridrich)",
                backMain: "← Menú Principal",
                cfopTitle: "Método CFOP",
                cfopSub: "Selecciona una etapa",
                fourLllName: " 4LLL (CFOP Simplificado)",
                f2lName: "1. F2L (42 casos)",
                ollName: "2. OLL (57 casos)",
                pllName: "3. PLL (21 casos)",
                backCfop: "← Volver a CFOP",
                backList: "← Volver a la lista",
                searchPH: "Buscar por nombre o descripción...",
                formulaLabel: "Fórmula:",
                copyBtn: "Copiar",
                copiedAlert: "¡Fórmula copiada!",
                soonStub: " ¡estará disponible pronto!"
            }
        };

        const db = {
            '4lll': {
                title: { 
                    ru: "Этап 4LLL (Упрощенный сбор CFOP)", 
                    en: "4LLL Stage (Simplified CFOP)", 
                    uk: "Етап 4LLL (Спрощений CFOP)", 
                    es: "Etapa 4LLL (CFOP Simplificado)" 
                },
                items: {
                    'EO - Line': { f: "F R U R' U' F'", d: { ru: "Ориентация ребер (Палка / Линия)", en: "Edge Orientation (Line)", uk: "Орієнтація ребер (Палиця)", es: "Orientación de bordes (Línea)" } },
                    'EO - Dot': { f: "F R U R' U' F' f R U R' U' f'", d: { ru: "Ориентация ребер (Точка)", en: "Edge Orientation (Dot)", uk: "Орієнтація ребер (Крапка)", es: "Orientación de bordes (Punto)" } },
                    'OC - Sune': { f: "R U R' U R U2 R'", d: { ru: "Ориентация углов (Рыбка)", en: "Corner Orientation (Sune)", uk: "Орієнтація кутів (Рибка)", es: "Orientación de esquinas (Sune)" } },
                    'OC - Anti-Sune': { f: "R U2 R' U' R U' R'", d: { ru: "Ориентация углов (Анти-рыбка)", en: "Corner Orientation (Anti-Sune)", uk: "Орієнтація кутів (Анти-рибка)", es: "Orientación de esquinas (Anti-Sune)" } },
                    'CP - Headlights': { f: "x R' D R' U2 R D' R' U2 R2 x'", d: { ru: "Перестановка углов (Глаза / Aa-Perm)", en: "Corner Permutation (Headlights)", uk: "Перестановка кутів (Очі)", es: "Permutación de esquinas (Luces)" } },
                    'EP - Ua Perm': { f: "R2 U' R' U' R U R U R U' R", d: { ru: "Перестановка ребер (Ua-Perm)", en: "Edge Permutation (Ua Perm)", uk: "Перестановка ребер (Ua-Perm)", es: "Permutación de bordes (Ua Perm)" } },
                    'EP - Ub Perm': { f: "R' U R' U' R' U' R' U R U R2", d: { ru: "Перестановка ребер (Ub-Perm)", en: "Edge Permutation (Ub Perm)", uk: "Перестановка ребер (Ub-Perm)", es: "Permutación de bordes (Ub Perm)" } },
                    'EP - H Perm': { f: "M2' U M2' U2 M2' U M2'", d: { ru: "Перестановка ребер (H-Perm)", en: "Edge Permutation (H Perm)", uk: "Перестановка ребер (H-Perm)", es: "Permutación de bordes (H Perm)" } },
                    'EP - Z Perm': { f: "M2' U M2' U' M' U2' M2' U2' M'", d: { ru: "Перестановка ребер (Z-Perm)", en: "Edge Permutation (Z Perm)", uk: "Перестановка ребер (Z-Perm)", es: "Permutación de bordes (Z Perm)" } }
                }
            },
            f2l: {
                title: { ru: "Этап F2L (42 случая)", en: "F2L Stage (42 cases)", uk: "Етап F2L (42 випадки)", es: "Etapa F2L (42 casos)" },
                items: {
                    'F2L 1': { f: "U R U' R'", d: { ru: "Базовый случай (Легкий загон)", en: "Basic case (Easy insertion)", uk: "Базовий випадок (Легке заведення)", es: "Caso básico (Inserción fácil)" } },
                    'F2L 2': { f: "y' U' L' U L", d: { ru: "Базовый случай (Зеркальный)", en: "Basic case (Mirror)", uk: "Базовий випадок (Дзеркальний)", es: "Caso básico (Espejo)" } },
                    'F2L 3': { f: "y' F' U' F", d: { ru: "Быстрый загон через фасад", en: "Quick front insertion", uk: "Швидке заведення через фасад", es: "Inserción frontal rápida" } },
                    'F2L 4': { f: "R U R'", d: { ru: "Прямой загон в слот", en: "Direct slot insertion", uk: "Пряме заведення в слот", es: "Inserción directa en ranura" } }
                }
            },
            oll: {
                title: { ru: "Этап OLL (57 случаев)", en: "OLL Stage (57 cases)", uk: "Етап OLL (57 випадків)", es: "Etapa OLL (57 casos)" },
                items: {
                    'OLL 21': { f: "R U2 R' U' R U R' U' R U' R'", d: { ru: "Крест — Распорка", en: "Cross — Brace", uk: "Хрест — Розпірка", es: "Cruz — Apoyo" } },
                    'OLL 27': { f: "R U R' U R U2 R'", d: { ru: "Крест — Правая рыбка", en: "Cross — Right sune", uk: "Хрест — Права рибка", es: "Cruz — Pez derecho" } }
                }
            },
            pll: {
                title: { ru: "Этап PLL (21 случай)", en: "PLL Stage (21 cases)", uk: "Етап PLL (21 випадок)", es: "Etapa PLL (21 casos)" },
                items: {
                    'H-Perm': { f: "M2' U M2' U2 M2' U M2'", d: { ru: "Противоположные ребра меняются парами", en: "Opposite edges swap in pairs", uk: "Протилежні ребра міняються парами", es: "Bordes opuestos se intercambian en parejas" } },
                    'Z-Perm': { f: "M2' U M2' U' M' U2' M2' U2' M'", d: { ru: "Соседние ребра меняются крест-накрест", en: "Adjacent edges swap diagonally", uk: "Сусідні ребра міняються навхрест", es: "Bordes adyacentes se intercambian en diagonal" } },
                    'Ua-Perm': { f: "R2 U' R' U' R U R U R U' R", d: { ru: "Цикл трех ребер против часовой", en: "3-edge cycle counter-clockwise", uk: "Цикл трьох ребер проти годинникової", es: "Ciclo de 3 bordes antihorario" } },
                    'T-Perm': { f: "R U R' U' R' F R2 U' R' U' R U R' F'", d: { ru: "Диагональный и смежный обмен", en: "Diagonal and adjacent swap", uk: "Діагональний та суміжний обмін", es: "Intercambio diagonal y adyacente" } }
                }
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active-lang'));
            document.getElementById('btn-' + lang).classList.add('active-lang');
            
            let t = translations[lang];
            document.getElementById('t-main-title').innerText = t.mainTitle;
            document.getElementById('t-main-sub').innerText = t.mainSub;
            document.getElementById('t-btn-cfop').innerText = t.btnCfop;
            document.getElementById('t-back-main').innerText = t.backMain;
            document.getElementById('t-cfop-title').innerText = t.cfopTitle;
            document.getElementById('t-cfop-sub').innerText = t.cfopSub;
            document.getElementById('t-4lll-name').innerText = t.fourLllName;
            document.getElementById('t-f2l-name').innerText = t.f2lName;
            document.getElementById('t-oll-name').innerText = t.ollName;
            document.getElementById('t-pll-name').innerText = t.pllName;
            document.getElementById('t-back-cfop').innerText = t.backCfop;
            document.getElementById('t-back-list').innerText = t.backList;
            document.getElementById('search').placeholder = t.searchPH;
            document.getElementById('t-formula-label').innerText = t.formulaLabel;
            document.getElementById('t-copy-btn').innerText = t.copyBtn;

            if (document.getElementById('view-list').classList.contains('active')) {
                document.getElementById('stage-title').innerText = db[currentStageKey].title[currentLang];
                renderItems(db[currentStageKey].items);
            }
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function showStub(name) {
            alert(name + translations[currentLang].soonStub);
        }

        function openStage(stage) {
            currentStageKey = stage;
            document.getElementById('stage-title').innerText = db[stage].title[currentLang];
            document.getElementById('search').value = '';
            renderItems(db[stage].items);
            switchView('view-list');
        }

        function renderItems(items) {
            let container = document.getElementById('list-container');
            container.innerHTML = '';
            for (let name in items) {
                let btn = document.createElement('button');
                btn.className = 'btn';
                let desc = items[name].d[currentLang];
                btn.innerHTML = `<span>${name}</span> <span style="color:var(--hint-color); font-size:13px;">${desc}</span>`;
                btn.onclick = () => showDetail(name, items[name]);
                container.appendChild(btn);
            }
        }

        function filterList() {
            let q = document.getElementById('search').value.toLowerCase();
            let all = db[currentStageKey].items;
            let filtered = {};
            for (let name in all) {
                let desc = all[name].d[currentLang].toLowerCase();
                if (name.toLowerCase().includes(q) || desc.includes(q)) {
                    filtered[name] = all[name];
                }
            }
            renderItems(filtered);
        }

        function showDetail(name, item) {
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-desc').innerText = item.d[currentLang];
            document.getElementById('det-formula').innerText = item.f;
            switchView('view-detail');
        }

        function copyText() {
            let text = document.getElementById('det-formula').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert(translations[currentLang].copiedAlert);
            });
        }
    </script>
</body>
</html>
