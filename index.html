<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Cube Guide</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="https://cdn.cubing.net/js/cubing/twisty"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #f1f1f1);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #007aff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            box-sizing: border-box;
        }
        .view { display: none; }
        .view.active { display: block; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 16px; }
        .subtitle { text-align: center; color: var(--hint-color); font-size: 14px; margin-bottom: 20px; }
        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
            justify-content: center;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--button-color);
            font-size: 16px;
            font-weight: 600;
            padding: 0;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
            position: relative;
        }
        .formula-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            background: rgba(128,128,128,0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 8px;
            word-break: break-all;
        }
        .copy-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(128,128,128,0.3);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .lang-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 20px;
        }
        .lang-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(128,128,128,0.3);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
        }
        .lang-btn.active-lang {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border-color: transparent;
        }
        .cube-3d-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
        twisty-player {
            width: 160px;
            height: 160px;
        }
    </style>
</head>
<body>

    <!-- Главное меню -->
    <div id="view-main" class="view active">
        <h1 id="t-main-title">🧩 Кубик Рубика</h1>
        <p class="subtitle" id="t-main-sub">Интерактивный справочник методов</p>
        <button class="btn btn-primary" onclick="switchView('view-cfop')" id="t-btn-cfop">🧩 Метод CFOP (Фридрих)</button>
        <button class="btn" onclick="openStage('4lll')" id="t-btn-4lll">🔰 Метод 4LLL (Упрощенный CFOP)</button>
        <button class="btn" onclick="showStub('Roux')" id="t-btn-roux">🔄 Метод Roux (скоро)</button>
        <button class="btn" onclick="showStub('Beginner')" id="t-btn-beginner">📖 Новичковый метод (скоро)</button>
        
        <div class="lang-container">
            <button class="lang-btn active-lang" id="btn-ru" onclick="setLang('ru')">🇷🇺 РУС</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 ENG</button>
            <button class="lang-btn" id="btn-uk" onclick="setLang('uk')">🇺🇦 УКР</button>
            <button class="lang-btn" id="btn-es" onclick="setLang('es')">🇪🇸 ESP</button>
        </div>
    </div>

    <!-- Меню CFOP -->
    <div id="view-cfop" class="view">
        <button class="back-btn" onclick="switchView('view-main')" id="t-back-main">← Главное меню</button>
        <h1 id="t-cfop-title">Метод CFOP</h1>
        <p class="subtitle" id="t-cfop-sub">Выберите этап для изучения</p>
        <button class="btn" onclick="openStage('f2l')"><span id="t-f2l-name">1. F2L (42 случая)</span> <span>›</span></button>
        <button class="btn" onclick="openStage('oll')"><span id="t-oll-name">2. OLL (57 случаев)</span> <span>›</span></button>
        <button class="btn btn-primary" onclick="openStage('pll')"><span id="t-pll-name">3. PLL (21 случай)</span> <span>›</span></button>
    </div>

    <!-- Список алгоритмов -->
    <div id="view-list" class="view">
        <button class="back-btn" onclick="goBackFromList()" id="t-back-list-btn">← Назад</button>
        <h1 id="stage-title">Список алгоритмов</h1>
        <input type="text" id="search" class="search-box" placeholder="Поиск..." oninput="filterList()">
        <div id="list-container"></div>
    </div>

    <!-- Детали алгоритма -->
    <div id="view-detail" class="view">
        <button class="back-btn" onclick="switchView('view-list')" id="t-back-detail">← К списку</button>
        <div class="card">
            <h2 id="det-title" style="margin-top:0; font-size:20px;">Название</h2>
            <p id="det-desc" style="color: var(--hint-color); font-size: 14px; margin-bottom: 12px;"></p>
            <p id="t-formula-label" style="margin-bottom: 6px; font-size: 14px; font-weight: 600;">Формула:</p>
            <div class="formula-box">
                <span id="det-formula"></span>
                <button class="copy-btn" onclick="copyText()" id="t-copy-btn">Копировать</button>
            </div>

            <div class="cube-3d-wrapper">
                <twisty-player 
                    id="cube-player" 
                    puzzle="3x3x3" 
                    visualization="3D" 
                    control-panel="none" 
                    background="none"
                    camera-latitude="30"
                    camera-longitude="-45"
                    setup-alg="z2">
                </twisty-player>
            </div>
        </div>
    </div>

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active-lang'));
            document.getElementById('btn-' + lang).classList.add('active-lang');
            
            let t = translations[lang];
            document.getElementById('t-main-title').innerText = t.mainTitle;
            document.getElementById('t-main-sub').innerText = t.mainSub;
            document.getElementById('t-btn-cfop').innerText = t.btnCfop;
            document.getElementById('t-btn-4lll').innerText = t.btn4lll;
            document.getElementById('t-btn-roux').innerText = t.btnRoux;
            document.getElementById('t-btn-beginner').innerText = t.btnBeginner;
            document.getElementById('t-back-main').innerText = t.backMain;
            document.getElementById('t-cfop-title').innerText = t.cfopTitle;
            document.getElementById('t-cfop-sub').innerText = t.cfopSub;
            document.getElementById('t-f2l-name').innerText = t.f2lName;
            document.getElementById('t-oll-name').innerText = t.ollName;
            document.getElementById('t-pll-name').innerText = t.pllName;
            document.getElementById('t-back-detail').innerText = t.backDetail;
            document.getElementById('search').placeholder = t.searchPH;
            document.getElementById('t-formula-label').innerText = t.formulaLabel;
            document.getElementById('t-copy-btn').innerText = t.copyBtn;

            updateListBackButtonText();

            if (document.getElementById('view-list').classList.contains('active')) {
                document.getElementById('stage-title').innerText = db[currentStageKey].title[currentLang];
                renderItems(db[currentStageKey].items);
            }
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function showStub(name) {
            alert(name + translations[currentLang].soonStub);
        }

        function openStage(stage) {
            currentStageKey = stage;
            document.getElementById('stage-title').innerText = db[stage].title[currentLang];
            document.getElementById('search').value = '';
            updateListBackButtonText();
            renderItems(db[stage].items);
            switchView('view-list');
        }

        function updateListBackButtonText() {
            let backBtn = document.getElementById('t-back-list-btn');
            if (currentStageKey === '4lll') {
                backBtn.innerText = translations[currentLang].backMain;
            } else {
                backBtn.innerText = translations[currentLang].backCfop;
            }
        }

        function goBackFromList() {
            if (currentStageKey === '4lll') {
                switchView('view-main');
            } else {
                switchView('view-cfop');
            }
        }

        function renderItems(items) {
            let container = document.getElementById('list-container');
            container.innerHTML = '';
            for (let name in items) {
                let btn = document.createElement('button');
                btn.className = 'btn';
                let desc = items[name].d[currentLang];
                btn.innerHTML = `<span>${name}</span> <span style="color:var(--hint-color); font-size:13px;">${desc}</span>`;
                btn.onclick = () => showDetail(name, items[name]);
                container.appendChild(btn);
            }
        }

        function filterList() {
            let q = document.getElementById('search').value.toLowerCase();
            let all = db[currentStageKey].items;
            let filtered = {};
            for (let name in all) {
                let desc = all[name].d[currentLang].toLowerCase();
                if (name.toLowerCase().includes(q) || desc.includes(q)) {
                    filtered[name] = all[name];
                }
            }
            renderItems(filtered);
        }

        function showDetail(name, item) {
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-desc').innerText = item.d[currentLang];
            document.getElementById('det-formula').innerText = item.f;

            let player = document.getElementById('cube-player');
            player.alg = "z2 " + item.f; 
            player.experimentalDragInput = 'none'; 

            switchView('view-detail');
        }

        function copyText() {
            let text = document.getElementById('det-formula').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert(translations[currentLang].copiedAlert);
            });
        }
    </script>
</body>
</html>
