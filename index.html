<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кубик Рубика - Справочник CFOP (119 формул) и Симулятор</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-color: #121212;
  --card-bg: #1e1e1e;
  --text-color: #ffffff;
  --text-secondary: #aaaaaa;
  --button-color: #007aff;
  --button-text-color: #ffffff;
  --border-color: rgba(255, 255, 255, 0.1);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  touch-action: manipulation;
}
.container-box {
  width: 100%;
  max-width: 520px;
}
.view {
  display: none;
  width: 100%;
}
.view.active {
  display: flex;
  flex-direction: column;
}
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header h1 { font-size: 22px; margin: 0 0 6px 0; font-weight: bold; }
.header p { font-size: 14px; color: var(--text-secondary); margin: 0; }
.menu-btn {
  background-color: var(--button-color);
  color: var(--button-text-color);
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
  text-align: center;
  width: 100%;
}
.cube-section {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  background: var(--card-bg);
  border-radius: 16px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
}
#cubeCanvasContainer {
  width: 100%;
  height: 280px;
  position: relative;
  margin-bottom: 12px;
  border-radius: 12px;
  background: rgba(0,0,0,0.25);
  overflow: hidden;
  display: block !important;
}
#cubeCanvas {
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
  display: block;
}
#cubeCanvas:active { cursor: grabbing; }
.controls-panel {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.control-row {
  display: flex;
  justify-content: space-between;
  gap: 3px;
}
.ctrl-btn {
  flex: 1;
  background-color: rgba(255,255,255,0.05);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 8px 0;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  user-select: none;
}
.ctrl-btn:active { background-color: var(--button-color); }
.ctrl-btn.spec {
  background-color: rgba(0, 122, 255, 0.2);
  color: #4da3ff;
  border-color: rgba(0, 122, 255, 0.4);
}
.list-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-height: 70vh;
  overflow-y: auto;
  padding-bottom: 20px;
}
.case-card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.case-card h3 { font-size: 15px; margin: 0 0 4px 0; color: #4da3ff; font-weight: bold; }
.case-card p {
  font-size: 11px;
  color: var(--text-secondary);
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.back-btn {
  background: none;
  border: none;
  color: var(--button-color);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 0;
  text-align: left;
}
.search-box {
  width: 100%;
  padding: 12px;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-color);
  font-size: 14px;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.detail-card {
  background-color: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.formula-box {
  background-color: rgba(0,0,0,0.4);
  border: 1px solid var(--border-color);
  padding: 12px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 15px;
  word-break: break-all;
  line-height: 1.4;
}
.copy-btn {
  background-color: var(--button-color);
  color: var(--button-text-color);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container-box">
  <!-- Main View -->
  <div id="view-main" class="view active">
    <div class="header">
      <h1>🧩 Кубик Рубика</h1>
      <p>Справочник CFOP (119 формул) и Симулятор</p>
    </div>

    <button class="menu-btn" onclick="showView('view-cfop')">🧩 Метод CFOP (Фридрих)</button>
    <button class="menu-btn" onclick="showView('view-4lll')" style="background-color: #2c2c2e; color: #fff;">📗 Метод 4LLL (Упрощенный)</button>

    <div class="cube-section">
      <div style="width: 100%; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 11px; color: var(--text-secondary); text-align: center;">Введите или вставьте формулу:</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="custom-formula-input" value="R U R' U'" style="flex: 1; padding: 8px 10px; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-family: monospace; font-size: 13px; outline: none;">
          <button onclick="executeCustomFormula()" style="background-color: var(--button-color); color: var(--button-text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Применить</button>
          <button onclick="resetCube()" style="background-color: #3a3a3c; color: var(--text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Сброс</button>
        </div>
      </div>
      <div id="cubeCanvasContainer">
        <canvas id="cubeCanvas"></canvas>
      </div>
      <div class="controls-panel" style="margin-top: 10px;">
        <div class="control-row">
          <button class="ctrl-btn" onclick="applyMove('R')">R</button>
          <button class="ctrl-btn" onclick="applyMove('R\'')">R'</button>
          <button class="ctrl-btn" onclick="applyMove('L')">L</button>
          <button class="ctrl-btn" onclick="applyMove('L\'')">L'</button>
          <button class="ctrl-btn" onclick="applyMove('U')">U</button>
          <button class="ctrl-btn" onclick="applyMove('U\'')">U'</button>
        </div>
        <div class="control-row">
          <button class="ctrl-btn" onclick="applyMove('D')">D</button>
          <button class="ctrl-btn" onclick="applyMove('D\'')">D'</button>
          <button class="ctrl-btn" onclick="applyMove('F')">F</button>
          <button class="ctrl-btn" onclick="applyMove('F\'')">F'</button>
          <button class="ctrl-btn" onclick="applyMove('B')">B</button>
          <button class="ctrl-btn" onclick="applyMove('B\'')">B'</button>
        </div>
        <div class="control-row">
          <button class="ctrl-btn" onclick="applyMove('M')">M</button>
          <button class="ctrl-btn" onclick="applyMove('M\'')">M'</button>
          <button class="ctrl-btn" onclick="applyMove('E')">E</button>
          <button class="ctrl-btn" onclick="applyMove('E\'')">E'</button>
          <button class="ctrl-btn" onclick="applyMove('S')">S</button>
          <button class="ctrl-btn" onclick="applyMove('S\'')">S'</button>
        </div>
        <div class="control-row special-row">
          <button class="ctrl-btn spec" onclick="applyMove('x')">x</button>
          <button class="ctrl-btn spec" onclick="applyMove('x\'')">x'</button>
          <button class="ctrl-btn spec" onclick="applyMove('y')">y</button>
          <button class="ctrl-btn spec" onclick="applyMove('y\'')">y'</button>
          <button class="ctrl-btn spec" onclick="applyMove('z')">z</button>
          <button class="ctrl-btn spec" onclick="applyMove('z\'')">z'</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CFOP Categories View -->
  <div id="view-cfop" class="view">
    <button class="back-btn" onclick="showView('view-main')">← На главную</button>
    <div class="header">
      <h1>Метод CFOP</h1>
      <p>Все 119 случаев (F2L: 41, OLL: 57, PLL: 21)</p>
    </div>
    <button class="menu-btn" onclick="openCategory('f2l')">F2L (41 случай)</button>
    <button class="menu-btn" onclick="openCategory('oll')">OLL (57 случаев)</button>
    <button class="menu-btn" onclick="openCategory('pll')">PLL (21 случай)</button>
  </div>

  <!-- 4LLL View -->
  <div id="view-4lll" class="view">
    <button class="back-btn" onclick="showView('view-main')">← На главную</button>
    <div class="header">
      <h1>Упрощенный CFOP (4LLL)</h1>
      <p>Базовые алгоритмы для быстрой сборки</p>
    </div>
    <div id="list-4lll-container" class="list-grid"></div>
  </div>

  <!-- Algorithms List View -->
  <div id="view-list" class="view">
    <button class="back-btn" onclick="showView('view-cfop')">← К списку этапов</button>
    <input type="text" class="search-box" id="search" placeholder="Поиск алгоритма..." oninput="filterAlgorithms()">
    <div id="algorithms-list" class="list-grid"></div>
  </div>

  <!-- Detail View -->
  <div id="view-detail" class="view">
    <button class="back-btn" onclick="showView('view-list')">← К списку</button>
    <div class="detail-card">
      <h2 id="detail-title" style="margin:0; font-size: 20px;">Название</h2>
      <p id="detail-desc" style="color: var(--text-secondary); margin:0; font-size: 14px;"></p>
      <div>
        <span style="font-size: 13px; color: var(--text-secondary);">Формула (Алгоритм решения):</span>
        <div class="formula-box" id="detail-formula">R U R'</div>
      </div>
      <div>
        <span style="font-size: 13px; color: var(--text-secondary);">Скрамбл (Для создания ситуации):</span>
        <div class="formula-box" id="detail-scramble" style="color: #4da3ff;">R U R'</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="copy-btn" onclick="copyFormula()" id="t-copy-btn" style="flex: 1;">Копировать формулу</button>
        <button class="copy-btn" onclick="applyCaseScramble()" style="background-color: #34c759; flex: 1;">Собрать ситуацию</button>
      </div>
    </div>
  </div>
</div>

let currentCategory = '';
let currentItemData = null;

let scene, camera, renderer, cubeGroup;
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let cubeRotation = { x: 0.5, y: -0.6 };
let cubelets = [];

const FACE_COLORS = {
  U: 0xffffff, // White
  D: 0xffd500, // Yellow
  F: 0x0051ba, // Blue
  B: 0x009e60, // Green
  L: 0xff5800, // Orange
  R: 0xc41e3a  // Red
};

function initCube3D() {
  const container = document.getElementById('cubeCanvasContainer');
  const canvas = document.getElementById('cubeCanvas');
  if (!container || !canvas) return;

  scene = new THREE.Scene();
  
  const width = container.clientWidth || 300;
  const height = container.clientHeight || 280;
  
  camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.z = 7.5;

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 10, 7);
  scene.add(directionalLight);

  createRubiksCube();

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;

    cubeRotation.y += deltaX * 0.008;
    cubeRotation.x += deltaY * 0.008;

    if (cubeGroup) {
      cubeGroup.rotation.x = cubeRotation.x;
      cubeGroup.rotation.y = cubeRotation.y;
    }

    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (!isDragging || e.touches.length !== 1) return;
    const deltaX = e.touches[0].clientX - previousMousePosition.x;
    const deltaY = e.touches[0].clientY - previousMousePosition.y;

    cubeRotation.y += deltaX * 0.008;
    cubeRotation.x += deltaY * 0.008;

    if (cubeGroup) {
      cubeGroup.rotation.x = cubeRotation.x;
      cubeGroup.rotation.y = cubeRotation.y;
    }

    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  window.addEventListener('touchend', () => {
    isDragging = false;
  });

  animate();
}

function createRubiksCube() {
  if (cubeGroup) {
    scene.remove(cubeGroup);
  }
  cubeGroup = new THREE.Group();
  cubelets = [];

  const size = 0.92;
  const spacing = 0.98;

  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        const geometry = new THREE.BoxGeometry(size, size, size);
        
        const materials = [
          new THREE.MeshBasicMaterial({ color: x === 1 ? FACE_COLORS.R : 0x111111 }),
          new THREE.MeshBasicMaterial({ color: x === -1 ? FACE_COLORS.L : 0x111111 }),
          new THREE.MeshBasicMaterial({ color: y === 1 ? FACE_COLORS.U : 0x111111 }),
          new THREE.MeshBasicMaterial({ color: y === -1 ? FACE_COLORS.D : 0x111111 }),
          new THREE.MeshBasicMaterial({ color: z === 1 ? FACE_COLORS.F : 0x111111 }),
          new THREE.MeshBasicMaterial({ color: z === -1 ? FACE_COLORS.B : 0x111111 })
        ];

        const cubelet = new THREE.Mesh(geometry, materials);
        cubelet.position.set(x * spacing, y * spacing, z * spacing);
        
        cubeGroup.add(cubelet);
        cubelets.push(cubelet);
      }
    }
  }

  cubeGroup.rotation.x = cubeRotation.x;
  cubeGroup.rotation.y = cubeRotation.y;
  scene.add(cubeGroup);
}

function animate() {
  requestAnimationFrame(animate);
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

function applyMove(moveStr) {
  if (!cubeGroup) return;
  const cleanMove = moveStr.trim();
  const base = cleanMove.replace(/['2]/g, '');
  const isPrime = cleanMove.includes("'");
  const isDouble = cleanMove.includes('2');
  
  let times = isDouble ? 2 : (isPrime ? 3 : 1);

  for (let t = 0; t < times; t++) {
    cubelets.forEach(c => {
      const pos = c.position;
      let rx = Math.round(pos.x / 0.98);
      let ry = Math.round(pos.y / 0.98);
      let rz = Math.round(pos.z / 0.98);

      let match = false;
      let axis = new THREE.Vector3(0, 0, 0);
      let angle = -Math.PI / 2;

      if (base === 'R' && rx === 1) { match = true; axis.set(1, 0, 0); angle = -Math.PI / 2; }
      else if (base === 'L' && rx === -1) { match = true; axis.set(1, 0, 0); angle = Math.PI / 2; }
      else if (base === 'U' && ry === 1) { match = true; axis.set(0, 1, 0); angle = -Math.PI / 2; }
      else if (base === 'D' && ry === -1) { match = true; axis.set(0, 1, 0); angle = Math.PI / 2; }
      else if (base === 'F' && rz === 1) { match = true; axis.set(0, 0, 1); angle = -Math.PI / 2; }
      else if (base === 'B' && rz === -1) { match = true; axis.set(0, 0, 1); angle = Math.PI / 2; }
      
      else if (base === 'M' && rx === 0) { match = true; axis.set(1, 0, 0); angle = Math.PI / 2; }
      else if (base === 'E' && ry === 0) { match = true; axis.set(0, 1, 0); angle = Math.PI / 2; }
      else if (base === 'S' && rz === 0) { match = true; axis.set(0, 0, 1); angle = -Math.PI / 2; }

      else if (base === 'u') {
        if (ry === 1 || ry === 0) { match = true; axis.set(0, 1, 0); angle = -Math.PI / 2; }
      }
      else if (base === 'd') {
        if (ry === -1 || ry === 0) { match = true; axis.set(0, 1, 0); angle = Math.PI / 2; }
      }
      else if (base === 'r') {
        if (rx === 1 || rx === 0) { match = true; axis.set(1, 0, 0); angle = -Math.PI / 2; }
      }
      else if (base === 'l') {
        if (rx === -1 || rx === 0) { match = true; axis.set(1, 0, 0); angle = Math.PI / 2; }
      }
      else if (base === 'f') {
        if (rz === 1 || rz === 0) { match = true; axis.set(0, 0, 1); angle = -Math.PI / 2; }
      }
      else if (base === 'b') {
        if (rz === -1 || rz === 0) { match = true; axis.set(0, 0, 1); angle = Math.PI / 2; }
      }

      else if (base === 'x') { match = true; axis.set(1, 0, 0); angle = -Math.PI / 2; }
      else if (base === 'y') { match = true; axis.set(0, 1, 0); angle = -Math.PI / 2; }
      else if (base === 'z') { match = true; axis.set(0, 0, 1); angle = -Math.PI / 2; }

      if (match) {
        c.position.applyAxisAngle(axis, angle);
        c.rotateOnWorldAxis(axis, angle);
        
        c.position.x = Math.round(c.position.x / 0.98) * 0.98;
        c.position.y = Math.round(c.position.y / 0.98) * 0.98;
        c.position.z = Math.round(c.position.z / 0.98) * 0.98;
      }
    });

    if (base === 'y') {
      const rotAngle = isPrime ? Math.PI / 2 : -Math.PI / 2;
      cubelets.forEach(c => {
        c.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotAngle);
        c.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), rotAngle);
        c.position.x = Math.round(c.position.x / 0.98) * 0.98;
        c.position.y = Math.round(c.position.y / 0.98) * 0.98;
        c.position.z = Math.round(c.position.z / 0.98) * 0.98;
      });
    } else if (base === 'x') {
      const rotAngle = isPrime ? Math.PI / 2 : -Math.PI / 2;
      cubelets.forEach(c => {
        c.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), rotAngle);
        c.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), rotAngle);
        c.position.x = Math.round(c.position.x / 0.98) * 0.98;
        c.position.y = Math.round(c.position.y / 0.98) * 0.98;
        c.position.z = Math.round(c.position.z / 0.98) * 0.98;
      });
    } else if (base === 'z') {
      const rotAngle = isPrime ? Math.PI / 2 : -Math.PI / 2;
      cubelets.forEach(c => {
        c.position.applyAxisAngle(new THREE.Vector3(0, 0, 1), rotAngle);
        c.rotateOnWorldAxis(new THREE.Vector3(0, 0, 1), rotAngle);
        c.position.x = Math.round(c.position.x / 0.98) * 0.98;
        c.position.y = Math.round(c.position.y / 0.98) * 0.98;
        c.position.z = Math.round(c.position.z / 0.98) * 0.98;
      });
    }
  }
}

function resetCube() {
  createRubiksCube();
}

function executeCustomFormula() {
  const input = document.getElementById('custom-formula-input').value;
  const tokens = input.trim().split(/\s+/);
  tokens.forEach(token => {
    if (!token) return;
    applyMove(token);
  });
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById(viewId);
  if (target) {
    target.classList.add('active');
    if (viewId === 'view-main') {
      setTimeout(() => {
        const container = document.getElementById('cubeCanvasContainer');
        if (!renderer && container) {
          initCube3D();
        } else if (renderer && container) {
          renderer.setSize(container.clientWidth || 300, container.clientHeight || 280);
        }
      }, 50);
    }
  }
}

function openCategory(cat) {
  currentCategory = cat;
  const listContainer = document.getElementById('algorithms-list');
  listContainer.innerHTML = '';
  
  const items = algorithmsData[cat] || [];
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru}</p>`;
    card.onclick = () => showDetail(item);
    listContainer.appendChild(card);
  });
  
  showView('view-list');
}

function load4LLLList() {
  const container = document.getElementById('list-4lll-container');
  container.innerHTML = '';
  const items = algorithmsData['4lll'] || [];
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru}</p>`;
    card.onclick = () => showDetail(item);
    container.appendChild(card);
  });
}

function showDetail(item) {
  currentItemData = item;
  document.getElementById('detail-title').innerText = item.name;
  document.getElementById('detail-desc').innerText = item.desc.ru;
  document.getElementById('detail-formula').innerText = item.formula;
  document.getElementById('detail-scramble').innerText = item.formula;
  showView('view-detail');
}

function copyFormula() {
  if (!currentItemData) return;
  const text = currentItemData.formula;
  const textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    const btn = document.getElementById('t-copy-btn');
    btn.innerText = 'Скопировано!';
    setTimeout(() => { btn.innerText = 'Копировать формулу'; }, 1500);
  } catch (err) {
    console.error('Copy failed', err);
  }
  document.body.removeChild(textArea);
}

function applyCaseScramble() {
  if (currentItemData) {
    document.getElementById('custom-formula-input').value = currentItemData.formula;
  }
  showView('view-main');
  resetCube();
  executeCustomFormula();
}

function filterAlgorithms() {
  const query = document.getElementById('search').value.toLowerCase();
  const listContainer = document.getElementById('algorithms-list');
  listContainer.innerHTML = '';
  
  const items = algorithmsData[currentCategory] || [];
  const filtered = items.filter(i => i.name.toLowerCase().includes(query) || i.desc.ru.toLowerCase().includes(query));
  
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru}</p>`;
    card.onclick = () => showDetail(item);
    listContainer.appendChild(card);
  });
}

window.onload = function() {
  load4LLLList();
  initCube3D();
};
