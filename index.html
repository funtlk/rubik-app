<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика - Профессиональный Симулятор</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --button-color: #007aff;
            --button-text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .view {
            display: none;
            width: 100%;
        }
        .view.active {
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; margin: 0 0 6px 0; }
        .header p { font-size: 14px; color: var(--text-secondary); margin: 0; }
        .lang-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lang-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .lang-btn.active-lang {
            border-color: var(--button-color);
            background-color: rgba(0, 122, 255, 0.2);
        }
        .menu-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
        }
        .cube-section {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }
        #cubeCanvas {
            width: 100%;
            height: 280px;
            margin-bottom: 12px;
            touch-action: none;
            cursor: grab;
            display: block;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        #cubeCanvas:active { cursor: grabbing; }
        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            gap: 3px;
        }
        .ctrl-btn {
            flex: 1;
            background-color: rgba(255,255,255,0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .ctrl-btn:active { background-color: var(--button-color); }
        .ctrl-btn.spec {
            background-color: rgba(0, 122, 255, 0.2);
            color: #4da3ff;
            border-color: rgba(0, 122, 255, 0.4);
        }
        .list-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 70vh;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .case-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .case-card h3 { font-size: 15px; margin: 0 0 6px 0; }
        .case-card p {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--button-color);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            padding: 0;
            text-align: left;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .detail-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .formula-box {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="view-main" class="view active">
        <div class="header">
            <h1 id="t-main-title">🧩 Кубик Рубика</h1>
            <p id="t-main-sub">Интерактивный справочник CFOP и Симулятор</p>
        </div>

        <div class="lang-container">
            <button class="lang-btn active-lang" id="btn-ru" onclick="setLang('ru')">🇷🇺 РУС</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 ENG</button>
            <button class="lang-btn" id="btn-uk" onclick="setLang('uk')">🇺🇦 УКР</button>
            <button class="lang-btn" id="btn-es" onclick="setLang('es')">🇪🇸 ESP</button>
        </div>

        <button class="menu-btn" onclick="showView('view-cfop')" id="t-btn-cfop">🧩 Метод CFOP (Фридрих)</button>
        <button class="menu-btn" onclick="showView('view-4lll')" id="t-btn-4lll" style="background-color: #2c2c2e; color: #fff;">📗 Метод 4LLL (Упрощенный CFOP)</button>

        <div class="cube-section">
            <div style="width: 100%; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;">
                <label id="t-custom-formula-label" style="font-size: 11px; color: var(--text-secondary); text-align: center;">Введите или вставьте формулу:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="custom-formula-input" value="x' R U' R' D R U R' D' R U R' D R U' R' D' x" style="flex: 1; padding: 8px 10px; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-family: monospace; font-size: 13px; outline: none;">
                    <button onclick="executeCustomFormula()" id="t-apply-formula-btn" style="background-color: var(--button-color); color: var(--button-text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Применить</button>
                    <button onclick="resetCube()" id="t-reset-btn" style="background-color: #3a3a3c; color: var(--text-color); border: none; border-radius: 8px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Сброс</button>
                </div>
            </div>
            <canvas id="cubeCanvas" width="300" height="280"></canvas>
            <div class="controls-panel">
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('R')">R</button>
                    <button class="ctrl-btn" onclick="applyMove('R\'')">R'</button>
                    <button class="ctrl-btn" onclick="applyMove('L')">L</button>
                    <button class="ctrl-btn" onclick="applyMove('L\'')">L'</button>
                    <button class="ctrl-btn" onclick="applyMove('U')">U</button>
                    <button class="ctrl-btn" onclick="applyMove('U\'')">U'</button>
                </div>
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('D')">D</button>
                    <button class="ctrl-btn" onclick="applyMove('D\'')">D'</button>
                    <button class="ctrl-btn" onclick="applyMove('F')">F</button>
                    <button class="ctrl-btn" onclick="applyMove('F\'')">F'</button>
                    <button class="ctrl-btn" onclick="applyMove('B')">B</button>
                    <button class="ctrl-btn" onclick="applyMove('B\'')">B'</button>
                </div>
                <div class="control-row">
                    <button class="ctrl-btn" onclick="applyMove('M')">M</button>
                    <button class="ctrl-btn" onclick="applyMove('M\'')">M'</button>
                    <button class="ctrl-btn" onclick="applyMove('E')">E</button>
                    <button class="ctrl-btn" onclick="applyMove('E\'')">E'</button>
                    <button class="ctrl-btn" onclick="applyMove('S')">S</button>
                    <button class="ctrl-btn" onclick="applyMove('S\'')">S'</button>
                </div>
                <div class="control-row special-row">
                    <button class="ctrl-btn spec" onclick="applyMove('x')">x</button>
                    <button class="ctrl-btn spec" onclick="applyMove('x\'')">x'</button>
                    <button class="ctrl-btn spec" onclick="applyMove('y')">y</button>
                    <button class="ctrl-btn spec" onclick="applyMove('y\'')">y'</button>
                    <button class="ctrl-btn spec" onclick="applyMove('z')">z</button>
                    <button class="ctrl-btn spec" onclick="applyMove('z\'')">z'</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-cfop" class="view">
        <button class="back-btn" onclick="showView('view-main')" id="t-back-main">← На главную</button>
        <div class="header">
            <h1 id="t-cfop-title">Метод CFOP</h1>
            <p id="t-cfop-sub">Выберите этап</p>
        </div>
        <button class="menu-btn" onclick="openCategory('f2l')" id="t-f2l-name">F2L (Первые два слоя)</button>
        <button class="menu-btn" onclick="openCategory('oll')" id="t-oll-name">OLL (Ориентация последнего слоя)</button>
        <button class="menu-btn" onclick="openCategory('pll')" id="t-pll-name">PLL (Пермутация последнего слоя)</button>
    </div>

    <div id="view-4lll" class="view">
        <button class="back-btn" onclick="showView('view-main')" id="t-back-4lll">← На главную</button>
        <div class="header">
            <h1 id="t-4lll-title">Упрощенный CFOP (4LLL)</h1>
            <p id="t-4lll-sub">Базовые алгоритмы для быстрой сборки</p>
        </div>
        <div id="list-4lll-container" class="list-grid"></div>
    </div>

    <div id="view-list" class="view">
        <button class="back-btn" onclick="showView('view-cfop')" id="t-back-detail">← К списку этапов</button>
        <input type="text" class="search-box" id="search" placeholder="Поиск алгоритма..." oninput="filterAlgorithms()">
        <div id="algorithms-list" class="list-grid"></div>
    </div>

    <div id="view-detail" class="view">
        <button class="back-btn" onclick="showView('view-list')" id="t-back-to-list">← К списку</button>
        <div class="detail-card">
            <h2 id="detail-title" style="margin:0; font-size: 20px;">Название</h2>
            <p id="detail-desc" style="color: var(--text-secondary); margin:0; font-size: 14px;"></p>
            <div>
                <span style="font-size: 13px; color: var(--text-secondary);" id="t-formula-label">Формула (Алгоритм решения):</span>
                <div class="formula-box" id="detail-formula">R U R'</div>
            </div>
            <div>
                <span style="font-size: 13px; color: var(--text-secondary);" id="t-scramble-label">Скрамбл (Для создания ситуации):</span>
                <div class="formula-box" id="detail-scramble" style="color: #4da3ff;">R U R'</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="copy-btn" onclick="copyFormula()" id="t-copy-btn" style="flex: 1;">Копировать формулу</button>
                <button class="copy-btn" onclick="applyCaseScramble()" id="t-apply-scramble-btn" style="background-color: #34c759; flex: 1;">Собрать ситуацию</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentLang = 'ru';
    let currentCategory = '';
    let currentItemData = null;
    
    let algorithmsData = {
        f2l: [
            { id: 1, name: "F2L 1", desc: { ru: "Базовый вправо" }, formula: "R U R'" },
            { id: 2, name: "F2L 2", desc: { ru: "Базовый влево" }, formula: "L' U' L" }
        ],
        oll: [
            { id: 21, name: "OLL 21", desc: { ru: "Крест" }, formula: "R U2 R2 U' R2 U' R2 U2 R" },
            { id: 27, name: "OLL 27", desc: { ru: "Рыбка" }, formula: "R U R' U R U2 R'" }
        ],
        pll: [
            { id: 3, name: "E Perm", desc: { ru: "Перестановка E" }, formula: "x' R U' R' D R U R' D' R U R' D R U' R' D' x" },
            { id: 9, name: "H Perm", desc: { ru: "Перестановка H" }, formula: "M2 U M2 U2 M2 U M2" },
            { id: 16, name: "T Perm", desc: { ru: "Перестановка T" }, formula: "R U R' U' R' F R2 U' R' U' R U R' F'" }
        ]
    };

    const translations = {
        ru: {
            mainTitle: "🧩 Кубик Рубика",
            mainSub: "Интерактивный справочник CFOP и Симулятор",
            btnCfop: "🧩 Метод CFOP (Фридрих)",
            btn4lll: "📗 Метод 4LLL (Упрощенный)",
            backMain: "← На главную",
            cfopTitle: "Метод CFOP",
            cfopSub: "Выберите этап",
            f2lName: "F2L (Первые два слоя)",
            ollName: "OLL (Ориентация последнего слоя)",
            pllName: "PLL (Пермутация последнего слоя)",
            title4lll: "Упрощенный CFOP (4LLL)",
            sub4lll: "Базовые алгоритмы для быстрой сборки",
            backDetail: "← К списку этапов",
            searchPH: "Поиск алгоритма...",
            formulaLabel: "Формула (Алгоритм решения):",
            scrambleLabel: "Скрамбл (Для создания ситуации):",
            copyBtn: "Копировать формулу",
            applyScrambleBtn: "Собрать ситуацию",
            backToList: "← К списку",
            customFormulaLabel: "Введите или вставьте формулу, чтобы получить ситуацию:",
            applyFormulaBtn: "Применить",
            resetBtn: "Сброс"
        }
    };

    function setLang(lang) {
        currentLang = lang;
        if (currentCategory && algorithmsData[currentCategory]) {
            renderAlgorithms(algorithmsData[currentCategory]);
        }
    }

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        window.scrollTo(0, 0);
        if (viewId === 'view-main') {
            drawCube();
        }
    }

    function openCategory(category) {
        currentCategory = category;
        renderAlgorithms(algorithmsData[category]);
        showView('view-list');
    }

    function renderAlgorithms(items) {
        const container = document.getElementById('algorithms-list');
        if (!container) return;
        container.innerHTML = '';
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.onclick = () => openDetail(item);
            card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru || ''}</p>`;
            container.appendChild(card);
        });
    }

    function filterAlgorithms() {
        const query = document.getElementById('search').value.toLowerCase();
        const items = algorithmsData[currentCategory] || [];
        renderAlgorithms(items.filter(i => i.name.toLowerCase().includes(query) || i.formula.toLowerCase().includes(query)));
    }

    function openDetail(item) {
        currentItemData = item;
        document.getElementById('detail-title').innerText = item.name;
        document.getElementById('detail-desc').innerText = item.desc.ru || '';
        document.getElementById('detail-formula').innerText = item.formula;
        document.getElementById('detail-scramble').innerText = getInverseScramble(item.formula);
        document.getElementById('custom-formula-input').value = item.formula;
        showView('view-detail');
    }

    function getInverseScramble(formula) {
        const clean = formula.replace(/[()]/g, ' ');
        const tokens = clean.split(/\s+/).filter(t => t.length > 0);
        let inverseTokens = [];
        for (let i = tokens.length - 1; i >= 0; i--) {
            let token = tokens[i];
            if (token.includes("'")) inverseTokens.push(token.replace("'", ""));
            else if (token.includes("2")) inverseTokens.push(token);
            else inverseTokens.push(token + "'");
        }
        return inverseTokens.join(' ');
    }

    async function applyCaseScramble() {
        if (!currentItemData) return;
        document.getElementById('custom-formula-input').value = getInverseScramble(currentItemData.formula);
        showView('view-main');
        await executeCustomFormula();
    }

    async function executeCustomFormula() {
        if (isMoving) return;
        const text = document.getElementById('custom-formula-input').value.trim();
        const tokens = text.replace(/[()]/g, ' ').split(/\s+/).filter(t => t.length > 0);
        for (let token of tokens) {
            while (isMoving) await new Promise(r => setTimeout(r, 10));
            applyMove(token);
        }
    }

    function resetCube() {
        if (isMoving) return;
        cubeState = createSolvedState();
        drawCube();
        document.getElementById('custom-formula-input').value = '';
    }

    function copyFormula() {
        navigator.clipboard.writeText(document.getElementById('detail-formula').innerText);
        const btn = document.getElementById('t-copy-btn');
        const old = btn.innerText;
        btn.innerText = 'Скопировано!';
        setTimeout(() => btn.innerText = old, 1500);
    }

    // --- CANVAS 2D ISOMETRIC ENGINE & STATE ---
    let canvas, ctx;
    let isMoving = false;
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let camRotX = 0.6, camRotY = 0.8;

    const COLORS = {
        R: '#c41e3a', // Red (+X)
        L: '#ff5800', // Orange (-X)
        U: '#ffffff', // White (+Y)
        D: '#ffd500', // Yellow (-Y)
        F: '#0051ba', // Blue (+Z)
        B: '#009e60', // Green (-Z)
        IN: '#181818' // Internal
    };

    let cubeState = [];

    function createSolvedState() {
        let state = [];
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    state.push({
                        x: x, y: y, z: z,
                        colors: [
                            x === 1 ? COLORS.R : COLORS.IN, // 0: +X
                            x === -1 ? COLORS.L : COLORS.IN,// 1: -X
                            y === 1 ? COLORS.U : COLORS.IN, // 2: +Y
                            y === -1 ? COLORS.D : COLORS.IN,// 3: -Y
                            z === 1 ? COLORS.F : COLORS.IN, // 4: +Z
                            z === -1 ? COLORS.B : COLORS.IN // 5: -Z
                        ]
                    });
                }
            }
        }
        return state;
    }

    function initEngine() {
        canvas = document.getElementById('cubeCanvas');
        ctx = canvas.getContext('2d');
        cubeState = createSolvedState();
        drawCube();

        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            camRotY -= (e.clientX - prevMouse.x) * 0.015;
            camRotX -= (e.clientY - prevMouse.y) * 0.015;
            camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
            prevMouse = { x: e.clientX, y: e.clientY };
            drawCube();
        });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            camRotY -= (e.touches[0].clientX - prevMouse.x) * 0.015;
            camRotX -= (e.touches[0].clientY - prevMouse.y) * 0.015;
            camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
            prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            drawCube();
        }, { passive: true });
        window.addEventListener('touchend', () => isDragging = false);
    }

    function rotatePoint(x, y, z, ry, rx) {
        // Rotate Y
        let x1 = x * Math.cos(ry) + z * Math.sin(ry);
        let y1 = y;
        let z1 = -x * Math.sin(ry) + z * Math.cos(ry);
        // Rotate X
        let x2 = x1;
        let y2 = y1 * Math.cos(rx) - z1 * Math.sin(rx);
        let z2 = y1 * Math.sin(rx) + z1 * Math.cos(rx);
        return { x: x2, y: y2, z: z2 };
    }

    function drawCube() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let scale = 42;
        let size = 0.9;

        // Calculate depth and sort cubies (painter's algorithm)
        let renderList = cubeState.map(cubie => {
            let p = rotatePoint(cubie.x, cubie.y, cubie.z, camRotY, camRotX);
            return { cubie, depth: p.z, pos: p };
        });
        renderList.sort((a, b) => a.depth - b.depth);

        renderList.forEach(item => {
            let cb = item.cubie;
            let hs = size / 2;

            // 6 faces definition relative to cubie center
            let faces = [
                { id: 0, norm: {x: 1, y: 0, z: 0}, color: cb.colors[0], corners: [[hs,-hs,-hs],[hs,hs,-hs],[hs,hs,hs],[hs,-hs,hs]] }, // +X
                { id: 1, norm: {x:-1, y: 0, z: 0}, color: cb.colors[1], corners: [[-hs,-hs,hs],[-hs,hs,hs],[-hs,hs,-hs],[-hs,-hs,-hs]] }, // -X
                { id: 2, norm: {x: 0, y: 1, z: 0}, color: cb.colors[2], corners: [[-hs,hs,-hs],[hs,hs,-hs],[hs,hs,hs],[-hs,hs,hs]] }, // +Y
                { id: 3, norm: {x: 0, y:-1, z: 0}, color: cb.colors[3], corners: [[-hs,-hs,hs],[hs,-hs,hs],[hs,-hs,-hs],[-hs,-hs,-hs]] }, // -Y
                { id: 4, norm: {x: 0, y: 0, z: 1}, color: cb.colors[4], corners: [[-hs,-hs,hs],[hs,-hs,hs],[hs,hs,hs],[-hs,hs,hs]] }, // +Z
                { id: 5, norm: {x: 0, y: 0, z:-1}, color: cb.colors[5], corners: [[hs,-hs,-hs],[-hs,-hs,-hs],[-hs,hs,-hs],[hs,hs,-hs]] }  // -Z
            ];

            faces.forEach(f => {
                let rNorm = rotatePoint(f.norm.x, f.norm.y, f.norm.z, camRotY, camRotX);
                if (rNorm.z > 0.001) { // Visible face
                    let projectedCorners = f.corners.map(c => {
                        let wx = cb.x + c[0];
                        let wy = cb.y + c[1];
                        let wz = cb.z + c[2];
                        let rp = rotatePoint(wx, wy, wz, camRotY, camRotX);
                        return {
                            x: cx + rp.x * scale,
                            y: cy - rp.y * scale
                        };
                    });

                    ctx.beginPath();
                    ctx.moveTo(projectedCorners[0].x, projectedCorners[0].y);
                    for (let i = 1; i < projectedCorners.length; i++) {
                        ctx.lineTo(projectedCorners[i].x, projectedCorners[i].y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = f.color;
                    ctx.fill();
                    ctx.strokeStyle = '#0a0a0a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });
        });
    }

    // --- LOGICAL STATE TRANSFORMATIONS ---
    function applyMove(moveStr) {
        if (isMoving) return;
        isMoving = true;

        const base = moveStr[0];
        const isPrime = moveStr.includes("'");
        const isDouble = moveStr.includes("2");

        let turns = 1;
        if (isPrime) turns = 3;
        if (isDouble) turns = 2;

        for (let t = 0; t < turns; t++) {
            rotateCubeStateLogical(base);
        }

        drawCube();
        setTimeout(() => { isMoving = false; }, 80);
    }

    function rotateCubeStateLogical(face) {
        const cR = 0, cL = 1, cU = 2, cD = 3, cF = 4, cB = 5;

        cubeState.forEach(item => {
            let match = false;
            if (face === 'R' && item.x > 0.5) match = true;
            if (face === 'L' && item.x < -0.5) match = true;
            if (face === 'U' && item.y > 0.5) match = true;
            if (face === 'D' && item.y < -0.5) match = true;
            if (face === 'F' && item.z > 0.5) match = true;
            if (face === 'B' && item.z < -0.5) match = true;
            if (face === 'M' && Math.abs(item.x) < 0.5) match = true;
            if (face === 'E' && Math.abs(item.y) < 0.5) match = true;
            if (face === 'S' && Math.abs(item.z) < 0.5) match = true;
            if (face === 'x' || face === 'y' || face === 'z') match = true;

            if (match) {
                let ox = item.x, oy = item.y, oz = item.z;
                let cols = [...item.colors];

                if (face === 'R' || (face === 'M' && face !== 'R') || face === 'x') {
                    item.y = -oz; item.z = oy;
                    item.colors[cU] = cols[cF]; item.colors[cF] = cols[cD];
                    item.colors[cD] = cols[cB]; item.colors[cB] = cols[cU];
                } else if (face === 'L') {
                    item.y = oz; item.z = -oy;
                    item.colors[cU] = cols[cB]; item.colors[cB] = cols[cD];
                    item.colors[cD] = cols[cF]; item.colors[cF] = cols[cU];
                } else if (face === 'U' || face === 'E' || face === 'y') {
                    item.x = -oz; item.z = ox;
                    item.colors[cF] = cols[cR]; item.colors[cR] = cols[cB];
                    item.colors[cB] = cols[cL]; item.colors[cL] = cols[cF];
                } else if (face === 'D') {
                    item.x = oz; item.z = -ox;
                    item.colors[cF] = cols[cL]; item.colors[cL] = cols[cB];
                    item.colors[cB] = cols[cR]; item.colors[cR] = cols[cF];
                } else if (face === 'F' || face === 'S' || face === 'z') {
                    item.x = -oy; item.y = ox;
                    item.colors[cU] = cols[cL]; item.colors[cL] = cols[cD];
                    item.colors[cD] = cols[cR]; item.colors[cR] = cols[cU];
                } else if (face === 'B') {
                    item.x = oy; item.y = -ox;
                    item.colors[cU] = cols[cR]; item.colors[cR] = cols[cD];
                    item.colors[cD] = cols[cL]; item.colors[cL] = cols[cU];
                }
            }
        });
    }

    window.onload = function() {
        initEngine();
        algorithmsData['4lll'] = [
            { id: 1, name: "OLL 21", desc: { ru: "Крест" }, formula: "R U2 R2 U' R2 U' R2 U2 R" },
            { id: 3, name: "PLL E-Perm", desc: { ru: "Перестановка E" }, formula: "x' R U' R' D R U R' D' R U R' D R U' R' D' x" }
        ];
    };
