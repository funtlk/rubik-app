<html lang="ru">
<head>

<style>
:root {
--bg-color: #121212;
--card-bg: #1e1e1e;
--text-color: #ffffff;
--text-secondary: #aaaaaa;
--button-color: #007aff;
--button-text-color: #ffffff;
--border-color: rgba(255, 255, 255, 0.1);
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 16px;
display: flex;
flex-direction: column;
align-items: center;
touch-action: manipulation;
}
.container {
width: 100%;
max-width: 520px;
}
.view {
display: none;
width: 100%;
}
.view.active {
display: flex;
flex-direction: column;
}
.header {
text-align: center;
margin-bottom: 20px;
}
.header h1 { font-size: 22px; margin: 0 0 6px 0; }
.header p { font-size: 14px; color: var(--text-secondary); margin: 0; }
.lang-container {
display: flex;
justify-content: center;
gap: 8px;
margin-bottom: 16px;
}
.lang-btn {
background-color: var(--card-bg);
color: var(--text-color);
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 6px 12px;
font-size: 12px;
cursor: pointer;
}
.lang-btn.active-lang {
border-color: var(--button-color);
background-color: rgba(0, 122, 255, 0.2);
}
.menu-btn {
background-color: var(--button-color);
color: var(--button-text-color);
border: none;
border-radius: 12px;
padding: 14px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
margin-bottom: 12px;
text-align: center;
width: 100%;
}
.cube-section {
margin-top: 10px;
display: flex;
flex-direction: column;
align-items: center;
width: 100%;
background: var(--card-bg);
border-radius: 16px;
padding: 12px;
box-sizing: border-box;
border: 1px solid var(--border-color);
}
#cubeCanvas {
width: 100%;
height: 280px;
margin-bottom: 12px;
touch-action: none;
cursor: grab;
display: block;
background: rgba(0,0,0,0.25);
border-radius: 12px;
}
#cubeCanvas:active { cursor: grabbing; }
.controls-panel {
width: 100%;
display: flex;
flex-direction: column;
gap: 5px;
}
.control-row {
display: flex;
justify-content: space-between;
gap: 3px;
}
.ctrl-btn {
flex: 1;
background-color: rgba(255,255,255,0.05);
color: var(--text-color);
border: 1px solid var(--border-color);
border-radius: 6px;
padding: 8px 0;
font-size: 13px;
font-weight: bold;
cursor: pointer;
text-align: center;
user-select: none;
}
.ctrl-btn:active { background-color: var(--button-color); }
.ctrl-btn.spec {
background-color: rgba(0, 122, 255, 0.2);
color: #4da3ff;
border-color: rgba(0, 122, 255, 0.4);
}
.list-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
max-height: 70vh;
overflow-y: auto;
padding-bottom: 20px;
}
.case-card {
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 12px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
}
.case-card h3 { font-size: 15px; margin: 0 0 6px 0; color: #4da3ff; }
.case-card p {
font-size: 11px;
color: var(--text-secondary);
margin: 0;
overflow: hidden;
text-overflow: ellipsis;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
}
.back-btn {
background: none;
border: none;
color: var(--button-color);
font-size: 16px;
font-weight: 600;
cursor: pointer;
margin-bottom: 16px;
padding: 0;
text-align: left;
}
.search-box {
width: 100%;
padding: 12px;
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 10px;
color: var(--text-color);
font-size: 14px;
margin-bottom: 16px;
box-sizing: border-box;
}
.detail-card {
background-color: var(--card-bg);
border-radius: 16px;
padding: 20px;
border: 1px solid var(--border-color);
display: flex;
flex-direction: column;
gap: 14px;
}
.formula-box {
background-color: rgba(0,0,0,0.4);
border: 1px solid var(--border-color);
padding: 12px;
border-radius: 8px;
font-family: monospace;
font-size: 15px;
word-break: break-all;
line-height: 1.4;
}
.copy-btn {
background-color: var(--button-color);
color: var(--button-text-color);
border: none;
border-radius: 8px;
padding: 12px;
font-weight: 600;
cursor: pointer;
}
</style>
</head>

​function getInverseScramble(formula) {
const clean = formula.replace(/[()]/g, ' ');
const tokens = clean.split(/\s+/).filter(t => t.length > 0);
let inverseTokens = [];
for (let i = tokens.length - 1; i >= 0; i--) {
let token = tokens[i];
if (token.includes("'")) inverseTokens.push(token.replace("'", ""));
else if (token.includes("2")) inverseTokens.push(token);
else inverseTokens.push(token + "'");
}
return inverseTokens.join(' ');
}

​// --- CANVAS 2D ISOMETRIC ENGINE & STATE ---
let canvas, ctx;
let isMoving = false;
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let camRotX = 0.6, camRotY = 0.8;
​const COLORS = {
R: '#c41e3a', // Red (+X)
L: '#ff5800', // Orange (-X)
U: '#ffffff', // White (+Y)
D: '#ffd500', // Yellow (-Y)
F: '#0051ba', // Blue (+Z)
B: '#009e60', // Green (-Z)
IN: '#181818' // Internal
};
​let cubeState = [];
​function createSolvedState() {
let state = [];
for (let x = -1; x <= 1; x++) {
for (let y = -1; y <= 1; y++) {
for (let z = -1; z <= 1; z++) {
state.push({
x: x, y: y, z: z,
colors: [
x === 1 ? COLORS.R : COLORS.IN, // 0: +X
x === -1 ? COLORS.L : COLORS.IN,// 1: -X
y === 1 ? COLORS.U : COLORS.IN, // 2: +Y
y === -1 ? COLORS.D : COLORS.IN,// 3: -Y
z === 1 ? COLORS.F : COLORS.IN, // 4: +Z
z === -1 ? COLORS.B : COLORS.IN // 5: -Z
]
});
}
}
}
return state;
}
​function initEngine() {
canvas = document.getElementById('cubeCanvas');
ctx = canvas.getContext('2d');
cubeState = createSolvedState();
drawCube();
​canvas.addEventListener('mousedown', e => {
isDragging = true;
prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mousemove', e => {
if (!isDragging) return;
camRotY -= (e.clientX - prevMouse.x) * 0.015;
camRotX -= (e.clientY - prevMouse.y) * 0.015;
camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
prevMouse = { x: e.clientX, y: e.clientY };
drawCube();
});
window.addEventListener('mouseup', () => isDragging = false);
​canvas.addEventListener('touchstart', e => {
if (e.touches.length === 1) {
isDragging = true;
prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}
}, { passive: true });
window.addEventListener('touchmove', e => {
if (!isDragging || e.touches.length !== 1) return;
camRotY -= (e.touches[0].clientX - prevMouse.x) * 0.015;
camRotX -= (e.touches[0].clientY - prevMouse.y) * 0.015;
camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
drawCube();
}, { passive: true });
window.addEventListener('touchend', () => isDragging = false);
}
​function rotatePoint(x, y, z, ry, rx) {
let x1 = x * Math.cos(ry) + z * Math.sin(ry);
let y1 = y;
let z1 = -x * Math.sin(ry) + z * Math.cos(ry);
​let x2 = x1;
let y2 = y1 * Math.cos(rx) - z1 * Math.sin(rx);
let z2 = y1 * Math.sin(rx) + z1 * Math.cos(rx);
return { x: x2, y: y2, z: z2 };
}
​function drawCube() {
if (!ctx) return;
ctx.clearRect(0, 0, canvas.width, canvas.height);
​let cx = canvas.width / 2;
let cy = canvas.height / 2;
let scale = 42;
let size = 0.9;
​let renderList = cubeState.map(cubie => {
let p = rotatePoint(cubie.x, cubie.y, cubie.z, camRotY, camRotX);
return { cubie, depth: p.z, pos: p };
});
renderList.sort((a, b) => a.depth - b.depth);
​renderList.forEach(item => {
let cb = item.cubie;
let hs = size / 2;
​let faces = [
{ id: 0, norm: {x: 1, y: 0, z: 0}, color: cb.colors[0], corners: [[hs,-hs,-hs],[hs,hs,-hs],[hs,hs,hs],[hs,-hs,hs]] },
{ id: 1, norm: {x:-1, y: 0, z: 0}, color: cb.colors[1], corners: [[-hs,-hs,hs],[-hs,hs,hs],[-hs,hs,-hs],[-hs,-hs,-hs]] },
{ id: 2, norm: {x: 0, y: 1, z: 0}, color: cb.colors[2], corners: [[-hs,hs,-hs],[hs,hs,-hs],[hs,hs,hs],[-hs,hs,hs]] },
{ id: 3, norm: {x: 0, y:-1, z: 0}, color: cb.colors[3], corners: [[-hs,-hs,hs],[hs,-hs,hs],[hs,-hs,-hs],[-hs,-hs,-hs]] },
{ id: 4, norm: {x: 0, y: 0, z: 1}, color: cb.colors[4], corners: [[-hs,-hs,hs],[hs,-hs,hs],[hs,hs,hs],[-hs,hs,hs]] },
{ id: 5, norm: {x: 0, y: 0, z:-1}, color: cb.colors[5], corners: [[hs,-hs,-hs],[-hs,-hs,-hs],[-hs,hs,-hs],[hs,hs,-hs]] }
];
​faces.forEach(f => {
let rNorm = rotatePoint(f.norm.x, f.norm.y, f.norm.z, camRotY, camRotX);
if (rNorm.z > 0.001) {
let projectedCorners = f.corners.map(c => {
let wx = cb.x + c[0];
let wy = cb.y + c[1];
let wz = cb.z + c[2];
let rp = rotatePoint(wx, wy, wz, camRotY, camRotX);
return {
x: cx + rp.x * scale,
y: cy - rp.y * scale
};
});
​ctx.beginPath();
ctx.moveTo(projectedCorners[0].x, projectedCorners[0].y);
for (let i = 1; i < projectedCorners.length; i++) {
ctx.lineTo(projectedCorners[i].x, projectedCorners[i].y);
}
ctx.closePath();
ctx.fillStyle = f.color;
ctx.fill();
ctx.strokeStyle = '#0a0a0a';
ctx.lineWidth = 1.5;
ctx.stroke();
}
});
});
}
​// --- LOGICAL STATE TRANSFORMATIONS ---
function applyMove(moveStr) {
if (isMoving) return;
isMoving = true;
​const base = moveStr[0];
const isPrime = moveStr.includes("'");
const isDouble = moveStr.includes("2");
​let turns = 1;
if (isPrime) turns = 3;
if (isDouble) turns = 2;
​for (let t = 0; t < turns; t++) {
rotateCubeStateLogical(base);
}
​drawCube();
setTimeout(() => { isMoving = false; }, 60);
}
​function rotateCubeStateLogical(face) {
const cR = 0, cL = 1, cU = 2, cD = 3, cF = 4, cB = 5;
​cubeState.forEach(item => {
let match = false;
if (face === 'R' && item.x > 0.5) match = true;
if (face === 'L' && item.x < -0.5) match = true;
if (face === 'U' && item.y > 0.5) match = true;
if (face === 'D' && item.y < -0.5) match = true;
if (face === 'F' && item.z > 0.5) match = true;
if (face === 'B' && item.z < -0.5) match = true;
if (face === 'M' && Math.abs(item.x) < 0.5) match = true;
if (face === 'E' && Math.abs(item.y) < 0.5) match = true;
if (face === 'S' && Math.abs(item.z) < 0.5) match = true;
if (face === 'x' || face === 'y' || face === 'z') match = true;
​if (match) {
let ox = item.x, oy = item.y, oz = item.z;
let cols = [...item.colors];
​if (face === 'R' || (face === 'M' && face !== 'R') || face === 'x') {
