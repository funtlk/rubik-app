<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кубик Рубика - Полный Справочник CFOP и Симулятор</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-color: #121212;
  --card-bg: #1e1e1e;
  --text-color: #ffffff;
  --text-secondary: #aaaaaa;
  --button-color: #007aff;
  --button-text-color: #ffffff;
  --border-color: rgba(255, 255, 255, 0.1);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  touch-action: manipulation;
}
.container-box {
  width: 100%;
  max-width: 520px;
}
.view {
  display: none;
  width: 100%;
}
.view.active {
  display: flex;
  flex-direction: column;
}
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header h1 { font-size: 22px; margin: 0 0 6px 0; font-weight: bold; }
.header p { font-size: 14px; color: var(--text-secondary); margin: 0; }
.menu-btn {
  background-color: var(--button-color);
  color: var(--button-text-color);
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
  text-align: center;
  width: 100%;
}
.cube-section {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  background: var(--card-bg);
  border-radius: 16px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
}
#cubeCanvas {
  width: 100%;
  height: 280px;
  margin-bottom: 12px;
  touch-action: none;
  cursor: grab;
  display: block;
  background: rgba(0,0,0,0.25);
  border-radius: 12px;
}
#cubeCanvas:active { cursor: grabbing; }
.controls-panel {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.control-row {
  display: flex;
  justify-content: space-between;
  gap: 3px;
}
.ctrl-btn {
  flex: 1;
  background-color: rgba(255,255,255,0.05);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 8px 0;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  user-select: none;
}
.ctrl-btn:active { background-color: var(--button-color); }
.ctrl-btn.spec {
  background-color: rgba(0, 122, 255, 0.2);
  color: #4da3ff;
  border-color: rgba(0, 122, 255, 0.4);
}
.list-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-height: 70vh;
  overflow-y: auto;
  padding-bottom: 20px;
}
.case-card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.case-card h3 { font-size: 15px; margin: 0 0 4px 0; color: #4da3ff; font-weight: bold; }
.case-card p {
  font-size: 11px;
  color: var(--text-secondary);
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.back-btn {
  background: none;
  border: none;
  color: var(--button-color);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 0;
  text-align: left;
}
.search-box {
  width: 100%;
  padding: 12px;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-color);
  font-size: 14px;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.detail-card {
  background-color: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.formula-box {
  background-color: rgba(0,0,0,0.4);
  border: 1px solid var(--border-color);
  padding: 12px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 15px;
  word-break: break-all;
  line-height: 1.4;
}
.copy-btn {
  background-color: var(--button-color);
  color: var(--button-text-color);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container-box">
  <!-- Main View -->

          <button class="ctrl-btn" onclick="applyMove('B')">B</button>
          <button class="ctrl-btn" onclick="applyMove('B\'')">B'</button>
        </div>
        <div class="control-row">
          <button class="ctrl-btn" onclick="applyMove('M')">M</button>
          <button class="ctrl-btn" onclick="applyMove('M\'')">M'</button>
          <button class="ctrl-btn" onclick="applyMove('E')">E</button>
          <button class="ctrl-btn" onclick="applyMove('E\'')">E'</button>
          <button class="ctrl-btn" onclick="applyMove('S')">S</button>
          <button class="ctrl-btn" onclick="applyMove('S\'')">S'</button>
        </div>
        <div class="control-row special-row">
          <button class="ctrl-btn spec" onclick="applyMove('x')">x</button>
          <button class="ctrl-btn spec" onclick="applyMove('x\'')">x'</button>
          <button class="ctrl-btn spec" onclick="applyMove('y')">y</button>
          <button class="ctrl-btn spec" onclick="applyMove('y\'')">y'</button>
          <button class="ctrl-btn spec" onclick="applyMove('z')">z</button>
          <button class="ctrl-btn spec" onclick="applyMove('z\'')">z'</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CFOP Categories View -->
  <div id="view-cfop" class="view">
    <button class="back-btn" onclick="showView('view-main')">← На главную</button>
    <div class="header">
      <h1>Метод CFOP</h1>
      <p>Выберите этап</p>
    </div>
    <button class="menu-btn" onclick="openCategory('f2l')">F2L (41 случай)</button>
    <button class="menu-btn" onclick="openCategory('oll')">OLL (57 случаев)</button>
    <button class="menu-btn" onclick="openCategory('pll')">PLL (21 случай)</button>
  </div>

  <!-- 4LLL View -->
  <div id="view-4lll" class="view">
    <button class="back-btn" onclick="showView('view-main')">← На главную</button>
    <div class="header">
      <h1>Упрощенный CFOP (4LLL)</h1>
      <p>Базовые алгоритмы для быстрой сборки</p>

  </div>

        <div class="formula-box" id="detail-formula">R U R'</div>
      </div>
      <div>

        <div class="formula-box" id="detail-scramble" style="color: #4da3ff;">R U R'</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="copy-btn" onclick="copyFormula()" id="t-copy-btn" style="flex: 1;">Копировать формулу</button>
        <button class="copy-btn" onclick="applyCaseScramble()" style="background-color: #34c759; flex: 1;">Собрать ситуацию</button>
      </div>
    </div>
  </div>
</div>

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  window.scrollTo(0, 0);
  if (viewId === 'view-main') {
    setTimeout(() => {
      if (canvas && ctx) drawCube();
    }, 50);
  } else if (viewId === 'view-4lll') {
    render4LLL();
  }
}

function openCategory(category) {
  currentCategory = category;
  renderAlgorithms(algorithmsData[category]);
  showView('view-list');
}

function renderAlgorithms(items) {
  const container = document.getElementById('algorithms-list');
  if (!container) return;
  container.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.onclick = () => openDetail(item);
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru || ''}</p>`;
    container.appendChild(card);
  });
}

function render4LLL() {
  const container = document.getElementById('list-4lll-container');
  if (!container) return;
  container.innerHTML = '';
  algorithmsData['4lll'].forEach(item => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.onclick = () => openDetail(item);
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc.ru || ''}</p>`;
    container.appendChild(card);
  });
}

function filterAlgorithms() {
  const query = document.getElementById('search').value.toLowerCase();
  const items = algorithmsData[currentCategory] || [];
  renderAlgorithms(items.filter(i => i.name.toLowerCase().includes(query) || i.formula.toLowerCase().includes(query)));
}

function openDetail(item) {
  currentItemData = item;
  document.getElementById('detail-title').innerText = item.name;
  document.getElementById('detail-desc').innerText = item.desc.ru || '';
  document.getElementById('detail-formula').innerText = item.formula;
  document.getElementById('detail-scramble').innerText = getInverseScramble(item.formula);
  document.getElementById('custom-formula-input').value = item.formula;
  showView('view-detail');
}

function getInverseScramble(formula) {
  const clean = formula.replace(/[()]/g, ' ');
  const tokens = clean.split(/\s+/).filter(t => t.length > 0);
  let inverseTokens = [];
  for (let i = tokens.length - 1; i >= 0; i--) {
    let token = tokens[i];
    if (token.includes("'")) inverseTokens.push(token.replace("'", ""));
    else if (token.includes("2")) inverseTokens.push(token);
    else inverseTokens.push(token + "'");
  }
  return inverseTokens.join(' ');
}

function applyCaseScramble() {
  if (!currentItemData) return;
  document.getElementById('custom-formula-input').value = getInverseScramble(currentItemData.formula);
  showView('view-main');
  executeCustomFormula();
}

function executeCustomFormula() {
  const text = document.getElementById('custom-formula-input').value.trim();
  const tokens = text.replace(/[()]/g, ' ').split(/\s+/).filter(t => t.length > 0);
  tokens.forEach(token => applyMove(token));
}

function resetCube() {
  cubeState = createSolvedState();
  drawCube();
  document.getElementById('custom-formula-input').value = '';
}

function copyFormula() {
  const text = document.getElementById('detail-formula').innerText;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(textArea);
  }
  const btn = document.getElementById('t-copy-btn');
  const old = btn.innerText;
  btn.innerText = 'Скопировано!';
  setTimeout(() => btn.innerText = old, 1500);
}

let canvas, ctx;
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let camRotX = 0.6, camRotY = 0.8;

const COLOR_HEX = {
  R: '#c41e3a', // Red (+X)
  L: '#ff5800', // Orange (-X)
  U: '#ffffff', // White (+Y)
  D: '#ffd500', // Yellow (-Y)
  F: '#0051ba', // Blue (+Z)
  B: '#009e60', // Green (-Z)
  IN: '#181818' // Internal
};

let cubeState = [];

function createSolvedState() {
  let state = [];
  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        state.push({
          x: x, y: y, z: z,
          faces: {
            R: x === 1 ? COLOR_HEX.R : COLOR_HEX.IN,
            L: x === -1 ? COLOR_HEX.L : COLOR_HEX.IN,
            U: y === 1 ? COLOR_HEX.U : COLOR_HEX.IN,
            D: y === -1 ? COLOR_HEX.D : COLOR_HEX.IN,
            F: z === 1 ? COLOR_HEX.F : COLOR_HEX.IN,
            B: z === -1 ? COLOR_HEX.B : COLOR_HEX.IN
          }
        });
      }
    }
  }
  return state;
}

function initEngine() {
  canvas = document.getElementById('cubeCanvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  cubeState = createSolvedState();
  drawCube();

  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    camRotY -= (e.clientX - prevMouse.x) * 0.015;
    camRotX -= (e.clientY - prevMouse.y) * 0.015;
    camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
    prevMouse = { x: e.clientX, y: e.clientY };
    drawCube();
  });
  window.addEventListener('mouseup', () => isDragging = false);

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!isDragging || e.touches.length !== 1) return;
    camRotY -= (e.touches[0].clientX - prevMouse.x) * 0.015;
    camRotX -= (e.touches[0].clientY - prevMouse.y) * 0.015;
    camRotX = Math.max(0.1, Math.min(Math.PI - 0.1, camRotX));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    drawCube();
  }, { passive: true });
  window.addEventListener('touchend', () => isDragging = false);
}

function rotatePoint(x, y, z, ry, rx) {
  let x1 = x * Math.cos(ry) + z * Math.sin(ry);
  let y1 = y;
  let z1 = -x * Math.sin(ry) + z * Math.cos(ry);

  let x2 = x1;
  let y2 = y1 * Math.cos(rx) - z1 * Math.sin(rx);
  let z2 = y1 * Math.sin(rx) + z1 * Math.cos(rx);
  return { x: x2, y: y2, z: z2 };
}

function drawCube() {
  if (!ctx || !canvas) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let cx = canvas.width / 2;
  let cy = canvas.height / 2;
  let scale = 42;
  let size = 0.9;

  let renderList = cubeState.map(cubie => {
    let p = rotatePoint(cubie.x, cubie.y, cubie.z, camRotY, camRotX);
    return { cubie, depth: p.z, pos: p };
  });
  renderList.sort((a, b) => a.depth - b.depth);

  const faceNormals = {
    R: { nx: 1, ny: 0, nz: 0 },
    L: { nx: -1, ny: 0, nz: 0 },
    U: { nx: 0, ny: 1, nz: 0 },
    D: { nx: 0, ny: -1, nz: 0 },
    F: { nx: 0, ny: 0, nz: 1 },
    B: { nx: 0, ny: 0, nz: -1 }
  };

  renderList.forEach(item => {
    let cb = item.cubie;
    let hs = size / 2;

    Object.keys(cb.faces).forEach(fKey => {
      let color = cb.faces[fKey];
      if (color === COLOR_HEX.IN) return;

      let fn = faceNormals[fKey];
      let rNorm = rotatePoint(fn.nx, fn.ny, fn.nz, camRotY, camRotX);
      if (rNorm.z > 0.001) {
        let corners = [];
        if (fKey === 'R') corners = [[hs,-hs,-hs],[hs,hs,-hs],[hs,hs,hs],[hs,-hs,hs]];
        if (fKey === 'L') corners = [[-hs,-hs,hs],[-hs,hs,hs],[-hs,hs,-hs],[-hs,-hs,-hs]];
        if (fKey === 'U') corners = [[-hs,hs,-hs],[hs,hs,-hs],[hs,hs,hs],[-hs,hs,hs]];
        if (fKey === 'D') corners = [[-hs,-hs,hs],[hs,-hs,hs],[hs,-hs,-hs],[-hs,-hs,-hs]];
        if (fKey === 'F') corners = [[-hs,-hs,hs],[hs,-hs,hs],[hs,hs,hs],[-hs,hs,hs]];
        if (fKey === 'B') corners = [[hs,-hs,-hs],[-hs,-hs,-hs],[-hs,hs,-hs],[hs,hs,-hs]];

        let projectedCorners = corners.map(c => {
          let wx = cb.x + c[0];
          let wy = cb.y + c[1];
          let wz = cb.z + c[2];
          let rp = rotatePoint(wx, wy, wz, camRotY, camRotX);
          return {
            x: cx + rp.x * scale,
            y: cy - rp.y * scale
          };
        });

        ctx.beginPath();
        ctx.moveTo(projectedCorners[0].x, projectedCorners[0].y);
        for (let i = 1; i < projectedCorners.length; i++) {
          ctx.lineTo(projectedCorners[i].x, projectedCorners[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#0a0a0a';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
    });
  });
}

function applyMove(moveStr) {
  let base = moveStr[0];
  let isPrime = moveStr.includes("'");
  let isDouble = moveStr.includes("2");

  let turns = 1;
  if (isPrime) turns = 3;
  if (isDouble) turns = 2;

  for (let t = 0; t < turns; t++) {
    rotateCubeLogical(base);
  }
  drawCube();
}

function rotateCubeLogical(move) {
  let axis = '';
  let dir = 1;
  let filter = c => true;

  if (move === 'R') { axis = 'X'; dir = -1; filter = c => c.x > 0.5; }
  else if (move === 'L') { axis = 'X'; dir = 1; filter = c => c.x < -0.5; }
  else if (move === 'U') { axis = 'Y'; dir = -1; filter = c => c.y > 0.5; }
  else if (move === 'D') { axis = 'Y'; dir = 1; filter = c => c.y < -0.5; }
  else if (move === 'F') { axis = 'Z'; dir = -1; filter = c => c.z > 0.5; }
  else if (move === 'B') { axis = 'Z'; dir = 1; filter = c => c.z < -0.5; }
  else if (move === 'M') { axis = 'X'; dir = 1; filter = c => Math.abs(c.x) < 0.5; }
  else if (move === 'E') { axis = 'Y'; dir = 1; filter = c => Math.abs(c.y) < 0.5; }
  else if (move === 'S') { axis = 'Z'; dir = -1; filter = c => Math.abs(c.z) < 0.5; }
  else if (move === 'x') { axis = 'X'; dir = -1; filter = c => true; }
  else if (move === 'y') { axis = 'Y'; dir = -1; filter = c => true; }
  else if (move === 'z') { axis = 'Z'; dir = -1; filter = c => true; }

  if (!axis) return;

  let newCubeState = cubeState.map(cb => {
    let matches = filter(cb);
    if (!matches) return cb;

    let nx = cb.x, ny = cb.y, nz = cb.z;
    let nFaces = { ...cb.faces };

    if (axis === 'X') {
      let oy = ny, oz = nz;
      if (dir === 1) { ny = -oz; nz = oy; }
      else { ny = oz; nz = -oy; }

      nFaces.U = cb.faces[dir === 1 ? 'B' : 'F'];
      nFaces.F = cb.faces[dir === 1 ? 'U' : 'D'];
      nFaces.D = cb.faces[dir === 1 ? 'F' : 'B'];
      nFaces.B = cb.faces[dir === 1 ? 'D' : 'U'];
    } else if (axis === 'Y') {
      let ox = nx, oz = nz;
      if (dir === 1) { nx = oz; nz = -ox; }
      else { nx = -oz; nz = ox; }

      nFaces.R = cb.faces[dir === 1 ? 'F' : 'B'];
      nFaces.B = cb.faces[dir === 1 ? 'R' : 'L'];
      nFaces.L = cb.faces[dir === 1 ? 'B' : 'F'];
      nFaces.F = cb.faces[dir === 1 ? 'L' : 'R'];
    } else if (axis === 'Z') {
      let ox = nx, oy = ny;
      if (dir === 1) { nx = -oy; ny = ox; }
      else { nx = oy; ny = -ox; }

      nFaces.U = cb.faces[dir === 1 ? 'L' : 'R'];
      nFaces.R = cb.faces[dir === 1 ? 'U' : 'D'];
      nFaces.D = cb.faces[dir === 1 ? 'R' : 'L'];
      nFaces.L = cb.faces[dir === 1 ? 'D' : 'U'];
    }

    return { x: Math.round(nx), y: Math.round(ny), z: Math.round(nz), faces: nFaces };
  });

  cubeState = newCubeState;
}

window.onload = function() {
  initEngine();
};
