<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест клика</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        .main-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1 id="title">Главный экран</h1>
    <p id="desc">Если вы это видите, сайт обновился.</p>
    
    <button class="main-btn" onclick="testClick()">НАЖМИ НА МЕНЯ</button>

    <script>
        function testClick() {
            document.getElementById('title').innerText = "УСПЕХ!";
            document.getElementById('desc').innerText = "Кнопка сработала, скрипт живой!";
            document.styleSheets[0].insertRule('body { background-color: #004400 !important; }', 0);
        }
    </script>

</body>
</html>
