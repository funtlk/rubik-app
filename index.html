<div>

<div class="flex items-center space-x-2">

<!-- Stats Modal Trigger -->
<button onclick="openStatsModal()" class="p-2 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition">

</button>
</div>
</header>

<div id="lang-menu" class="hidden absolute top-16 right-4 z-50 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-2 w-36 backdrop-blur-md">
<button onclick="setLanguage('ru')" class="w-full text-left px-3 py-2 rounded-xl text-sm hover:bg-indigo-600/20 hover:text-indigo-400 transition flex items-center justify-between">
<span>🇷🇺 Русский</span> <span id="check-ru" class="text-indigo-400 text-xs font-bold">✓</span>
</button>
<button onclick="setLanguage('en')" class="w-full text-left px-3 py-2 rounded-xl text-sm hover:bg-indigo-600/20 hover:text-indigo-400 transition flex items-center justify-between">
<span>🇬🇧 English</span> <span id="check-en" class="text-indigo-400 text-xs font-bold hidden">✓</span>
</button>
<button onclick="setLanguage('uk')" class="w-full text-left px-3 py-2 rounded-xl text-sm hover:bg-indigo-600/20 hover:text-indigo-400 transition flex items-center justify-between">
<span>🇺🇦 Українська</span> <span id="check-uk" class="text-indigo-400 text-xs font-bold hidden">✓</span>
</button>
<button onclick="setLanguage('es')" class="w-full text-left px-3 py-2 rounded-xl text-sm hover:bg-indigo-600/20 hover:text-indigo-400 transition flex items-center justify-between">
<span>🇪🇸 Español</span> <span id="check-es" class="text-indigo-400 text-xs font-bold hidden">✓</span>
</button>
</div>
​<!-- Main Container -->
<main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24 overflow-y-auto">
​<!-- Category & Mode Tabs -->
<div class="grid grid-cols-4 gap-1.5 bg-slate-800/80 p-1.5 rounded-2xl mb-4 border border-slate-700/50 shadow-inner">
<button onclick="switchCategory('f2l')" id="cat-btn-f2l" class="py-2.5 rounded-xl font-semibold text-xs tracking-wide transition shadow-sm bg-indigo-600 text-white">F2L</button>
<button onclick="switchCategory('oll')" id="cat-btn-oll" class="py-2.5 rounded-xl font-semibold text-xs tracking-wide transition text-slate-400 hover:text-white">OLL</button>
<button onclick="switchCategory('pll')" id="cat-btn-pll" class="py-2.5 rounded-xl font-semibold text-xs tracking-wide transition text-slate-400 hover:text-white">PLL</button>
<button onclick="switchCategory('4lll')" id="cat-btn-4lll" class="py-2.5 rounded-xl font-semibold text-xs tracking-wide transition text-slate-400 hover:text-white">4LLL</button>
</div>
​<!-- Sub-filter / Mode Bar -->
<div class="flex items-center justify-between bg-slate-800/40 px-3 py-2 rounded-xl mb-4 border border-slate-700/30 text-xs">
<div class="flex items-center space-x-2">
<span id="txt-view-mode" class="text-slate-400 font-medium">Режим:</span>
<button onclick="toggleViewMode()" id="view-mode-btn" class="px-2.5 py-1 rounded-lg bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30 hover:bg-indigo-600/30 transition">Список</button>

<div class="flex items-center space-x-2">

</div>
</div>

<div class="relative mb-4">
<i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>

</div>

<div id="list-view" class="space-y-3">
<!-- Dynamically populated via JS -->
</div>
​<!-- TRAINER / QUIZ VIEW CONTAINER -->

</div>

<div class="absolute inset-0 bg-indigo-600/10 opacity-0 group-hover:opacity-100 transition rounded-2xl flex items-center justify-center">

</div>
​<div id="quiz-answer-section" class="space-y-3">

R U R' U'

❌ Забыл (-1)

<button onclick="answerQuiz(true)" class="py-2.5 rounded-xl bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 font-semibold text-sm transition border border-emerald-500/30">

<button onclick="closeStatsModal()" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">

document.getElementById('stat-lbl-learned').textContent = t.learnedCases;
document.getElementById('stat-lbl-accuracy').textContent = t.accuracy;
renderCategory();
}

​let currentCategory = 'f2l';
let viewMode = 'list'; // 'list' or 'quiz'
let currentQuizList = [];
let quizIndex = 0;
let learnedCases = JSON.parse(localStorage.getItem('cfop_learned') || '{}');
let quizStats = JSON.parse(localStorage.getItem('cfop_stats') || '{"correct":0, "total":0}');
​function switchCategory(cat) {
currentCategory = cat;
['f2l', 'oll', 'pll', '4lll'].forEach(c => {
const btn = document.getElementById(cat-btn-${c});
if (c === cat) {
btn.className = "py-2.5 rounded-xl font-semibold text-xs tracking-wide transition shadow-sm bg-indigo-600 text-white";
} else {
btn.className = "py-2.5 rounded-xl font-semibold text-xs tracking-wide transition text-slate-400 hover:text-white";
}
});
document.getElementById('search-input').value = '';
if (viewMode === 'list') {
renderList();
} else {
startQuizMode();
}
}
​function toggleViewMode() {
viewMode = viewMode === 'list' ? 'quiz' : 'list';
const btn = document.getElementById('view-mode-btn');
const listView = document.getElementById('list-view');
const quizView = document.getElementById('quiz-view');
const t = translations[currentLang];
​if (viewMode === 'quiz') {
btn.textContent = t.viewQuiz;
listView.classList.add('hidden');
quizView.classList.remove('hidden');
startQuizMode();
} else {
btn.textContent = t.viewList;
quizView.classList.add('hidden');
listView.classList.remove('hidden');
renderList();
}
}
​function renderList() {
const container = document.getElementById('list-view');
const query = document.getElementById('search-input').value.toLowerCase();
const items = database[currentCategory].filter(item =>
item.name.toLowerCase().includes(query) ||
item.alg.toLowerCase().includes(query) ||
(item.desc && item.desc.toLowerCase().includes(query))
);
​document.getElementById('total-count').textContent = items.length;
​if (items.length === 0) {
container.innerHTML = <div class="text-center py-12 text-slate-500 text-sm">Ничего не найдено</div>;
return;
}
​container.innerHTML = items.map(item => {
const isLearned = learnedCases[${currentCategory}_${item.id}];
return <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between shadow-md hover:border-indigo-500/50 transition"> <div class="space-y-1 pr-3 flex-1"> <div class="flex items-center space-x-2"> <span class="font-bold text-sm text-white">${item.name}</span> ${item.desc ?<span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/80 text-slate-300">${item.desc}</span>: ''} </div> <div class="font-mono text-xs text-indigo-400 font-bold tracking-wider select-all pt-0.5">${item.alg}</div> </div> <div class="flex items-center space-x-2"> <button onclick="toggleLearned('${currentCategory}', ${item.id})" class="w-9 h-9 rounded-xl flex items-center justify-center transition ${isLearned ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-700/50 text-slate-400 hover:bg-slate-700'}"> <i class="fa-solid fa-check text-xs"></i> </button> </div> </div>;
}).join('');
}
​function filterAlgorithms() {
if (viewMode === 'list') {
renderList();
}
}
​function toggleLearned(cat, id) {
const key = ${cat}_${id};
learnedCases[key] = !learnedCases[key];
localStorage.setItem('cfop_learned', JSON.stringify(learnedCases));
renderList();
}
​function startQuizMode() {
currentQuizList = [...database[currentCategory]].sort(() => Math.random() - 0.5);
quizIndex = 0;
loadQuizCard();
}
​function loadQuizCard() {
if (quizIndex >= currentQuizList.length) {
quizIndex = 0;
currentQuizList.sort(() => Math.random() - 0.5);
}
const item = currentQuizList[quizIndex];
document.getElementById('quiz-progress').textContent = ${quizIndex + 1} / ${currentQuizList.length};
document.getElementById('quiz-case-title').textContent = item.name;
document.getElementById('quiz-case-desc').textContent = item.desc || currentCategory.toUpperCase();
document.getElementById('quiz-alg-box').textContent = item.alg;
document.getElementById('quiz-alg-box').classList.add('hidden');
document.getElementById('reveal-btn').classList.remove('hidden');
document.getElementById('quiz-rating-buttons').classList.add('hidden');
}
​function revealQuizAnswer() {
document.getElementById('reveal-btn').classList.add('hidden');
document.getElementById('quiz-alg-box').classList.remove('hidden');
document.getElementById('quiz-rating-buttons').classList.remove('hidden');
}
​function answerQuiz(known) {
quizStats.total++;
if (known) quizStats.correct++;
localStorage.setItem('cfop_stats', JSON.stringify(quizStats));
quizIndex++;
loadQuizCard();
}
​function exitQuizMode() {
toggleViewMode();
}
​function openStatsModal() {
let learnedTotal = Object.values(learnedCases).filter(Boolean).length;
document.getElementById('stat-learned-count').textContent = ${learnedTotal} / 119;
let acc = quizStats.total > 0 ? Math.round((quizStats.correct / quizStats.total) * 100) : 0;
document.getElementById('stat-accuracy').textContent = ${acc}%;
document.getElementById('stats-modal').classList.remove('hidden');
}
​function closeStatsModal() {
document.getElementById('stats-modal').classList.add('hidden');
}
​function switchNavTab(tab) {
['learn', 'trainer', 'timer'].forEach(t => {
const btn = document.getElementById(nav-${t});
if (t === tab) {
btn.className = "flex flex-col items-center space-y-1 text-indigo-400 transition";
} else {
btn.className = "flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition";
}
});
if (tab === 'timer') {
alert("Таймер скоро будет доступен в следующем обновлении!");
switchNavTab('learn');
} else if (tab === 'trainer' && viewMode === 'list') {
toggleViewMode();
} else if (tab === 'learn' && viewMode === 'quiz') {
toggleViewMode();
}
}
​// Initialize Telegram WebApp if available
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}
​// Initial render
renderList();
</script>
